up, original strategy exits, and error/research ZIP exports are preserved. This build does not synthesize trades, extend real quote freshness, guarantee every asset ticks during quiet market, or automatically arm real orders. Official API outages, missing stock credentials, stock exchange closed hours and real historical candle gaps are shown accurately. Regression tests, Android15 emulator cold and warm launch and same original signing certificate are automated; Kiwoom/Upbit live broker fills and physical Samsung export are not verified. Install as an UPDATE over existing app without uninstalling." --prerelease
      - name: Upload Android 15 smoke evidence
