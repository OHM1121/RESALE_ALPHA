name: ARTITRADE v106 read-only 3LEG31 / QUID RSI / reconnect inspection
on:
  push:
    branches: [fix-artitrade-v095-errors-20261118]
    paths: ['.github/workflows/forensic-v106-quid-threeleg.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-code-and-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Extract exact 82-module original and inspect native three-leg exits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          p=root/'assets/strategy_v070'
          original=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          bridge=(root/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text('utf8')
          assert 'CORE_SHA256="'+hashlib.sha256(original).hexdigest()+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(original)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/artitrade-v106-native')
              for file,classname,methods in (
                ('d_engine.py','PaperEngine',('_minute_exits_threeleg','_minute_exits')),
                ('d_v19_portfolio.py','D19PaperEngine',('_minute_exits','_sell'))):
                  s=z.read(file).decode('utf8')
                  lines=s.splitlines()
                  cls=next((c for c in ast.parse(s).body if isinstance(c,ast.ClassDef) and c.name==classname),None)
                  if cls is None:
                      print('NOT_FOUND_CLASS',file,classname)
                      continue
                  for name in methods:
                      fn=next((n for n in cls.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name==name),None)
                      if fn is None:
                          print('INHERITED_OR_ABSENT',classname,name)
                          continue
                      print('--- ORIGINAL',file,classname,name,fn.lineno,fn.end_lineno,'---')
                      for ln in range(fn.lineno-1,min(fn.end_lineno,len(lines),fn.lineno+155)):
                          print(f'{ln+1}: {lines[ln]}')
          PY
      - name: Prove QUID 14:57 is forming-candle time and coin fast lane
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v106-native:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import datetime as dt,inspect
          import market_trend_v043 as mt
          from market_trend_preplan_v099 import PreparedCoinTrend
          from market_trend_runtime_v043 import _end_clock
          t=dt.datetime(2026,11,18,14,57,44,tzinfo=mt.KST)
          end=_end_clock(t,'coin','5m')
          assert (end-t).total_seconds()==136.0
          assert end==dt.datetime(2026,11,18,15,0,tzinfo=mt.KST)
          assert not mt.preclose_due(t,end,'5m','coin')
          assert 'if self.market=="stock" and not mt.preclose_due' in inspect.getsource(PreparedCoinTrend._candidate_decision)
          print('QUID_EVENT_20261118_145744_KST_BAR_END',end.isoformat())
          print('SECONDS_BEFORE_BAR_CLOSE',int((end-t).total_seconds()))
          print('NORMAL_PRECLOSE_WINDOW_ELIGIBLE',mt.preclose_due(t,end,'5m','coin'))
          print('COIN_FASTLANE_MID_BAR_ENTRY_CODE_PATH',True)
          print('ORIGINAL_QUID_TICK_AND_RSI_PROOF_NOT_INCLUDED_IN_REPO',True)
          PY
          for suite in test_v099_coin_trend_preplan.py test_v091_d19_original_at_reconnect_and_portrait.py test_v092_scenarios_8_wallets.py; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$suite" -v
          done
