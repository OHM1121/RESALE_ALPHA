name: ARTITRADE v007 root-cause, error-log regression and dependency governance - NO APK
on:
  push:
    branches: [fix-artitrade-007-v005-errorlog-rootcause-governance-20261119]
  pull_request:
    branches: [fix-artitrade-006-trend5m-retire-rootcause-audit-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original native test import dependencies
        run: python3 -m pip install -q requests==2.32.5 websockets==15.0.1 holidays
      - name: Verify original source and extract it for offline regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile,ast
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          buf=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          assert hashlib.sha256(buf).hexdigest()=='b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb'
          with zipfile.ZipFile(io.BytesIO(buf)) as z:
              assert z.testzip() is None
              for n in z.namelist():
                  if n.endswith('.py'):
                      ast.parse(z.read(n).decode('utf8'),filename=n)
              z.extractall('/tmp/artitrade-v006-original')
          PY
      - name: Compile all Python and run native PAPER/state-machine recovery suites
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v006-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          for suite in \
            test_v007_error_history_root_contracts.py \
            test_v006_trend_5m_retirement_and_startup.py \
            test_v004_abnormal_reconnect_six.py \
            test_v005_market_score_empty_wallet.py \
            test_v002_eight_virtual_paper_end_to_end.py \
            test_new_legacy_1118_workbook.py \
            test_v1118_fresh_score_bootstrap.py \
            test_v033_market_research.py \
            test_v038_market_live_ui.py \
            test_v043_market_trend.py \
            test_v086_stock_manual_all.py \
            test_v106_fresh_paper_epoch.py \
            test_v108_mandatory_first_epoch.py; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$suite" -v
          done
      - name: Prove no APK was packaged or signed
        run: test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
  android-source-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Java only, never assemble an APK
        run: |
          set -euo pipefail
          gradle -p ARTITRADE_ANDROID :app:compileUnifiedDebugJavaWithJavac --no-daemon --stacktrace
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk

  dependency-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build verified original/overlay/Java source dependency inventory
        run: |
          set -euo pipefail
          python3 tools/artitrade/build_source_graph.py --output artitrade_source_graph.json
      - name: Enforce cross-AI root-cause and per-version issue contracts
        run: |
          set -euo pipefail
          python3 tools/artitrade/validate_dependency_contracts.py --generated artitrade_source_graph.json
      - name: Check that code changed with the version and dependency registries
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 tools/artitrade/validate_dependency_contracts.py \
            --generated artitrade_source_graph.json --base "origin/$BASE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARTITRADE_V007_FULL_SOURCE_DEPENDENCY_GRAPH
          path: artitrade_source_graph.json
          if-no-files-found: ignore
