name: ARTITRADE v081 inspect verified startup/feed APIs
on:
  push:
    branches: [ artitrade-v081-preload-both-feeds-20261116 ]
    paths: [ '.github/workflows/artitrade-v081-inspect-startup.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original SHA-pinned core startup/sockets without modifying source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile,io,re
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          p=root/'assets/strategy_v070'
          z=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(22)))
          bridge=(root/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert 'CORE_SHA256="'+hashlib.sha256(z).hexdigest()+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(z)) as f:
              assert f.testzip() is None
              for name,spans in [
                  ('android_live_bridge.py',[(218,240),(280,315),(435,477)]),
                  ('d_live.py',[(1880,1930),(1940,2017),(2025,2092),(2180,2248),(2280,2327)]),
                  ('d_upbit.py',[(2790,2830),(2840,2895),(3730,3805),(3840,3869)])
              ]:
                  lines=f.read(name).decode().splitlines()
                  print('===FILE===',name,len(lines))
                  for start,end in spans:
                      for i in range(start-1,min(len(lines),end)):
                          print('CTX',i+1,lines[i][:230])
          PY
