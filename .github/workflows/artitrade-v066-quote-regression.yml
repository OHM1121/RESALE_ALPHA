name: ARTITRADE v066 stock quote truth full offline regression
on:
  push:
    branches: [ feature-artitrade-v066-stock-fresh-quote-audit-20261116 ]
    paths:
      - 'ARTITRADE_ANDROID/app/src/main/python/stock_quote_truth_v066.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py'
      - 'ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java'
      - 'ARTITRADE_ANDROID/ui_tests/test_v066_stock_quote_truth.py'
      - '.github/workflows/artitrade-v066-quote-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install only original regression imports
        run: python3 -m pip install -q requests websockets holidays
      - name: Extract unchanged signed v064 Python core for original parity tests
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          core=base64.b64decode(''.join((root/('part_%02d.txt'%i)).read_text('ascii') for i in range(22)))
          assert hashlib.sha256(core).hexdigest()=='10ff2cc9cda6ebba1dfa183f893bcea76f38445bb109dac66b99d578cc9c5447'
          dest=Path('/tmp/artitrade-v066-original-core');dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(core)) as z:z.extractall(dest)
          policy=(dest/'projectgmo/engine.py').read_text('utf8')
          assert 'entry_profit_floor: float = 0.02' in policy
          assert 'ENTRY_PLUS2_FLOOR' in policy
          print('V062_GMO_EXACT_2_PERCENT_EXIT_UNCHANGED')
          print('SIGNING_CORE_NOT_CHANGED_OR_OVERWRITTEN')
          PY
      - name: Compile and test quote provenance without brokers
        env:
          PYTHONPATH: '/tmp/artitrade-v066-original-core:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -e
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v066_*.py' -v
      - name: Run existing MA/Trend/GMO nontrading regression matrix
        env:
          PYTHONPATH: '/tmp/artitrade-v066-original-core:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -e
          for pat in 'test_v064_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v053_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -q
          done
      - name: Confirm read-only UI source targets
        run: |
          grep -Fq 'stockQuoteCurrent(r)' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -Fq "return Double.NaN" ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -Fq 'install_ui_quote_tap(self.stock_runner)' ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          git diff --check
