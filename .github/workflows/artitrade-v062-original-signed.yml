name: ARTITRADE v0.7.62 Original Signed APK
on:
  push:
    branches:
      - artitrade-phone-main-v070-live-orders-20261112
    paths:
      - '.github/workflows/artitrade-v062-original-signed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artitrade-v062-signer
  cancel-in-progress: false
jobs:
  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 'true'
      SOURCE: '61cea5ad1b745da6a88c9a2c0a79d59013e5e991'
      ARTIFACT: 'ARTITRADE_UNIFIED_v0.7.62_20261116'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '61cea5ad1b745da6a88c9a2c0a79d59013e5e991'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore only the original in-place compatible signing certificate
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Strict signing identity proof
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.cache-hit }}" = "true"
          test -f "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6"
      - name: Extract SHA-verified legacy EXE for regression tests only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          z=base64.b64decode(''.join((p/('part_%02d.txt'%i)).read_text() for i in range(22)))
          assert hashlib.sha256(z).hexdigest()=='e7518cb90a73cf62522aaa8962d872890e9e517ae988f52c22b3d94ed88531e0'
          dest=Path('/tmp/artitrade-core-verified')
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(z)) as f:f.extractall(dest)
          print('IMMUTABLE_EXE_VERIFIED')
          PY
      - name: Verify targeted v062 and unchanged legacy regressions
        shell: bash
        env:
          PYTHONPATH: '/tmp/artitrade-core-verified:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          for pat in 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -v
          done
      - name: Build originally signed arm64 package for existing S21+ app
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Verify package, monotonic version and original signature
        shell: bash
        run: |
          set -euo pipefail
          apk="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='69' versionName='0.7.62-MA-EPOCH-RESEARCH'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" >/tmp/v062-apksigner.txt
          grep -F '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/v062-apksigner.txt
          unzip -l "$apk" | grep -F 'assets/chaquopy/app.imy'
          cp "$apk" "$ARTIFACT.apk"
          sha256sum "$ARTIFACT.apk" > "$ARTIFACT.sha256"
          printf 'source=%s\npackage=com.artitrade.unified.s21dex\nversionCode=69\nversionName=v0.7.62\noriginal_signing_certificate_sha256=37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6\nno_ledger_reset=true\n' "$SOURCE" > "$ARTIFACT.compatibility.txt"
      - name: Upload original-certified installable APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_UNIFIED_v0.7.62_20261116
          path: |
            ARTITRADE_UNIFIED_v0.7.62_20261116.apk
            ARTITRADE_UNIFIED_v0.7.62_20261116.sha256
            ARTITRADE_UNIFIED_v0.7.62_20261116.compatibility.txt
          if-no-files-found: error
          retention-days: 30
