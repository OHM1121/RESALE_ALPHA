name: V089 read-only stock+coin 900ms prices and preload sensor-rotation regression
on:
  push:
    branches: [fix-artitrade-v089-quote-plane-preload-rotation-20261118]
    paths:
      - .github/workflows/verify-v089-fast-quote-preload.yml
      - ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedTradingService.java
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java
      - ARTITRADE_ANDROID/ui_tests/test_v089_fast_quote_rotation.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-and-java:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Original EXE core and non-mutating Python quote regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          data=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/artitrade-original-exe-v089')
          PY
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-original-exe-v089:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v089_fast_quote_rotation.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v087_rotation_cw_quote_recovery.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v088_export_zip_full_500mb_coin_monotonic.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_at_native_catchup.py' -v
      - name: Compile real Android native UI and embedded Chaquopy Python
        working-directory: ARTITRADE_ANDROID
        shell: bash
        run: |
          set -euo pipefail
          # Ephemeral test-only certificate on CI. Not used for any USER APK.
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ARTITRADE CI DEBUG ONLY,O=Regression,L=Test,C=KR"
          gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
          find app/build/outputs/apk -name '*.apk' -size +10M -print -quit |
            grep -q apk
