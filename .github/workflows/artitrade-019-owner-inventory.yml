name: ARTITRADE 0.0.19 original eight-wallet source inventory (no user data)
on:
  push:
    branches: [artitrade-019-eight-wallet-target-plan-display-20261119]
    paths: [.github/workflows/artitrade-019-owner-inventory.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Print native original source method and SQLite table contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,io,zipfile
          root=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          data=base64.b64decode("".join((root/("part_%02d.txt"%i)).read_text("ascii") for i in range(22)))
          assert hashlib.sha256(data).hexdigest()=="b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb"
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall("/tmp/artitrade-v019-native")
          PY
          python3 ARTITRADE_ANDROID/ui_tests/audit_v019_native_owner.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/artitrade-v019-native")
          targets={
            "d_v19_portfolio.py":[(1384,1435),(1710,1730)],
            "d_upbit.py":[(708,745),(2090,2135),(696,708)],
            "stock_ma_engine.py":[(130,153),(268,282)],
            "at_close_engine.py":[(185,210)],
            "projectgmo/engine.py":[(533,608)],
            "d_gmo_runtime.py":[(1100,1160)],
          }
          from pathlib import Path
          for source in root.rglob("*.py"):
              lines=source.read_text("utf8").splitlines()
              hits=[i for i,line in enumerate(lines) if
                    "def _record_execution(" in line or
                    "CREATE TABLE IF NOT EXISTS executions" in line or
                    "CREATE TABLE IF NOT EXISTS positions(" in line]
              if hits and any(k in source.name for k in
                              ("d_v18","d_portfolio","d_store","d_v19")):
                  print("ORIGINAL_RECEIPT_OWNER",source.relative_to(root))
                  for i in hits:
                      for n in range(max(0,i-3),min(len(lines),i+18)):
                          print(n+1,lines[n][:250])
          for name,ranges in targets.items():
              ls=(root/name).read_text("utf8").splitlines()
              for a,b in ranges:
                  print("SOURCE",name,a,b)
                  for i in range(a-1,min(b,len(ls))):
                      print("  %04d:"%(i+1),ls[i])
          PY
