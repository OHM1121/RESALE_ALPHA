name: ARTITRADE v082 error-cancel and MA source regressions
on:
  push:
    branches: [ fix-artitrade-v082-errors-cancel-three-stage-orders-20261117 ]
    paths:
      - '.github/workflows/verify-v082-error-export-and-ma.yml'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_research_bundle.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_ledger_backup.py'
      - 'ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java'
      - 'ARTITRADE_ANDROID/ui_tests/test_v082_error_export_cancellation.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/**'
      - 'ARTITRADE_ANDROID/ui_tests/test_v082_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract unchanged original EXE runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          p=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          raw=base64.b64decode(''.join((p/f"part_{i:02d}.txt").read_text("ascii") for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              z.extractall("/tmp/artitrade-v082-exe")
          PY
      - name: Cancellation, full-source export parity and original MA stage regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v082-exe"
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v082_error_export_cancellation.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v088_error_exports_and_source_integrity.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_legacy_ma_exit.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_ma_three_stage_real_ledger.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v082_kiwoom_fill_reconcile.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v082_three_stage_buy_recovery.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v097_gmo_preplan.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v099_coin_trend_preplan.py' -v
