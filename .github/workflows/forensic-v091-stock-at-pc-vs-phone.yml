name: V091 original PC stock/coin exits, Android feed dispatch and resume forensic audit
on:
  push:
    branches: [fix-artitrade-v091-stock-at-exit-root-cause-portrait-20261118]
    paths: [.github/workflows/forensic-v091-stock-at-pc-vs-phone.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: bash
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,ast,re
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            for filename in ('d_engine.py','d_live.py','d_upbit.py','d_storage.py','d_runtime.py','d_v19_portfolio.py'):
              if filename not in z.namelist():continue
              src=z.read(filename).decode('utf8')
              lines=src.splitlines()
              tree=ast.parse(src)
              funcs=[]
              def visit(node,parent=''):
                if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  funcs.append((node.lineno,node.end_lineno,parent+node.name))
                for child in ast.iter_child_nodes(node):
                  if isinstance(child,ast.ClassDef):visit(child,parent+child.name+'.')
                  elif isinstance(child,(ast.FunctionDef,ast.AsyncFunctionDef)):visit(child,parent)
                  elif not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):visit(child,parent)
              visit(tree)
              rx=re.compile(r'minute|tick|websocket|sell|paper|exits|catch|subscribe|resume|start|run|stock|price|reconnect|close|pending|open|replay|update',re.I)
              matches=[(a,b,n) for a,b,n in funcs if rx.search(n)]
              print('===FILE',filename,'LEN',len(lines),'FUNCTIONS',len(matches),flush=True)
              for a,b,n in matches[:175]:print('DEF',filename,a,b,n)
              if filename=='d_engine.py':
                for a,b,n in matches:
                  if 'PaperEngine.' in n and (any(x in n.lower() for x in ('minute_exits','on_minute','on_tick','sell','exit','apply','process','update'))):
                    print('==BEGIN',filename,n,'FROM',a,'TO',b)
                    for i in range(a-1,min(b,len(lines))):print('L',filename,i+1,lines[i][:230])
              if filename=='d_live.py':
                for a,b,n in matches:
                  if 'LivePaperRunner.' in n and any(x in n.lower() for x in ('run','tick','receive','stream','minute','exit','handle','connect','subscribe','recover')):
                    print('==BEGIN',filename,n,'FROM',a,'TO',b)
                    for i in range(a-1,min(b,len(lines))):print('L',filename,i+1,lines[i][:230])
              if filename=='d_upbit.py':
                for a,b,n in matches:
                  if 'UpbitPaperRunner.' in n and any(x in n.lower() for x in ('run','tick','resume','sell','exit','reconcile','sync','handle')):
                    print('==BEGIN',filename,n,'FROM',a,'TO',b)
                    for i in range(a-1,min(b,len(lines))):print('L',filename,i+1,lines[i][:230])
          PY
