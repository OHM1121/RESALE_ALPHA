name: ARTITRADE v075 close betting and public stock price audit
on:
  push:
    branches: [fix-artitrade-v075-gmo-cw-audit-20261116]
    paths: ['.github/workflows/artitrade-v075-close-and-prices.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only inspect bundled CW policy and 2026-11-13/16 public closes
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,ast,re,urllib.request,urllib.parse,json,datetime as dt,zoneinfo,sys
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          blob=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
            for name in ('at_close_engine.py','at_close_runner.py','at_close_api.py','at_close_bridge.py','at_close_cache.py','at_close_store.py','projectgmo/prices.py','d_gmo_runtime.py'):
              src=z.read(name).decode();lines=src.splitlines()
              print('=== FILE',name,'LEN',len(lines),'===')
              tree=ast.parse(src)
              for node in ast.walk(tree):
                if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  print('METHOD',node.name,node.lineno,node.end_lineno)
              if name=='d_gmo_runtime.py':
                wanted=[(850,884),(1075,1118)]
              else:
                wanted=[(1,min(400,len(lines)))]
              for a,b in wanted:
                for i in range(a,min(b,len(lines))+1):
                  print('LINE',name,i,lines[i-1][:300])
          KST=zoneinfo.ZoneInfo('Asia/Seoul')
          b=int(dt.datetime(2026,10,1,tzinfo=KST).timestamp());e=int(dt.datetime(2026,11,17,tzinfo=KST).timestamp())
          for code in ('180640.KS','003230.KS'):
            try:
              url='https://query1.finance.yahoo.com/v8/finance/chart/'+code+'?'+urllib.parse.urlencode({
                  'period1':b,'period2':e,'interval':'1d'})
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=18) as r:result=json.load(r)['chart']['result'][0]
              q=result['indicators']['quote'][0]
              rows=[(dt.datetime.fromtimestamp(t,KST).date().isoformat(),q['open'][i],q['close'][i])
                    for i,t in enumerate(result['timestamp']) if q['close'][i] is not None]
              print('=== PUBLIC_DAILY',code,len(rows),'===')
              print('PRICE_LAST_23',rows[-23:])
              for date in ('2026-11-13','2026-11-16'):
                n=next((i for i,r in enumerate(rows) if r[0]==date),None)
                if n is not None:
                  o=rows[n]
                  print('PRICE_EVENT',code,date,'OPEN',o[1],'CLOSE',o[2],'PREV_CLOSE',rows[n-1][2] if n>=1 else None,
                        '5D_UP',round((o[2]/rows[n-5][2]-1)*100,4) if n>=5 else None,
                        '20D_UP',round((o[2]/rows[n-20][2]-1)*100,4) if n>=20 else None)
            except Exception as exc:print('PRICE_NOT_RETRIEVED',code,type(exc).__name__,str(exc)[:170])
          PY
