name: ARTITRADE v0.7.49 Unified Safety Signed APK
on:
  push:
    branches:
      - fix-artitrade-unified-v049-20261115
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v049-unified-safe-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artitrade-v049-update-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore original phone-compatible signing key
        id: signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Reject missing or different signing certificate
        run: |
          test "${{ steps.signing.outputs.cache-hit }}" = "true" || { echo "STABLE_SIGNING_CACHE_MISSING"; exit 1; }
          test -f "$HOME/.android/debug.keystore"
          EXPECTED="37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "UPDATE_CERTIFICATE_MISMATCH"; exit 1; }
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Test unified safety regressions including original ledgers
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v049_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_android_ledger_backup.py' -v
          for V in v048 v047 v046 v045 v044 v043 v042 v041 v040 v039 v038 v037 v036 v035 v031; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "test_${V}_*.py" -v
          done
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v028_trade_record_parity.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v030_*.py' -v
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          mkdir -p /tmp/artitrade-v049-jvm
          javac -d /tmp/artitrade-v049-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SignedMarketScore.java ARTITRADE_ANDROID/ui_tests/SignedMarketScoreTest.java
          java -cp /tmp/artitrade-v049-jvm com.artitrade.mobile.SignedMarketScoreTest
          javac -d /tmp/artitrade-v049-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistorySelection.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchScoreGrid.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchBandSelection.java ARTITRADE_ANDROID/ui_tests/ResearchBandSelectionTest.java ARTITRADE_ANDROID/ui_tests/ResearchScoreGridTest.java
          java -cp /tmp/artitrade-v049-jvm com.artitrade.mobile.ResearchBandSelectionTest
          java -cp /tmp/artitrade-v049-jvm com.artitrade.mobile.ResearchScoreGridTest
          javac -d /tmp/artitrade-v049-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ColumnQueryV036.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStatusV036.java ARTITRADE_ANDROID/ui_tests/ColumnQueryV036Test.java ARTITRADE_ANDROID/ui_tests/SyncStatusV036Test.java
          java -cp /tmp/artitrade-v049-jvm com.artitrade.mobile.ColumnQueryV036Test
          java -cp /tmp/artitrade-v049-jvm com.artitrade.mobile.SyncStatusV036Test
      - name: Build unified APK with the recovered certificate
        working-directory: ARTITRADE_ANDROID
        env:
          CI: 'true'
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Verify signature package version and create installable APK
        run: |
          APK="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='56'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > /tmp/artitrade-v049-signature.txt
          grep -Fi '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/artitrade-v049-signature.txt
          cp "$APK" ARTITRADE_UNIFIED_v0.7.49_20261115.apk
          sha256sum ARTITRADE_UNIFIED_v0.7.49_20261115.apk > ARTITRADE_UNIFIED_v0.7.49_20261115.sha256
      - name: Upload direct-install unified APK only
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_UNIFIED_v0.7.49_20261115
          path: |
            ARTITRADE_UNIFIED_v0.7.49_20261115.apk
            ARTITRADE_UNIFIED_v0.7.49_20261115.sha256
          if-no-files-found: error
          retention-days: 14
