name: ARTITRADE v074 marketwide Upbit RSI20 public potential scan
on:
  push:
    branches: [fix-artitrade-v074-ma-trend-forensic-20261116]
    paths: ['.github/workflows/artitrade-v074-all-coin-rsi-audit.yml']
permissions: {contents: read}
jobs:
  public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan all KRW pairs from public completed candle OHLC ONLY
        run: |
          python3 - <<'PY'
          import csv,datetime as dt,urllib.request,urllib.parse,urllib.error,json,time,sys
          from pathlib import Path
          sys.path.insert(0,'ARTITRADE_ANDROID/app/src/main/python')
          import market_trend_v043 as mt
          OUT=Path('market_audit');OUT.mkdir(exist_ok=True)
          def request(path,params):
            url='https://api.upbit.com/v1/'+path+'?'+urllib.parse.urlencode(params)
            for retry in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'ARTITRADE-v074-PUBLIC-CANDLE-FORENSIC','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=14) as r:return json.load(r)
              except urllib.error.HTTPError as exc:
                if exc.code in (429,418,500,502,503) and retry<2:
                  time.sleep((retry+1)*1.3);continue
                raise
          all_markets=request('market/all',{'is_details':'false'})
          krw=sorted(x['market'] for x in all_markets if str(x.get('market','')).startswith('KRW-'))
          print('MARKETS_TOTAL',len(all_markets),'KRW_MARKETS',len(krw))
          records=[];errors=[]
          start='2026-11-16T09:00:00';end='2026-11-16T15:40:00'
          for index,code in enumerate(krw,1):
            time.sleep(.17) # shared public candle REST <=10 requests/second
            try:
              raw=request('candles/minutes/5',{'market':code,'to':'2026-11-16T06:40:00Z','count':200})
              candles=sorted(raw,key=lambda x:x['candle_date_time_kst'])
              for i,bar in enumerate(candles):
                stamp=bar['candle_date_time_kst']
                if not start<=stamp<end or i<21:continue
                old=candles[:i]
                previous=old[-1]['candle_date_time_kst']
                continuous=(dt.datetime.fromisoformat(stamp)-dt.datetime.fromisoformat(previous)).total_seconds()==300
                lo=mt.rsi20([float(x['trade_price']) for x in old],float(bar['low_price']))
                close=mt.rsi20([float(x['trade_price']) for x in old],float(bar['trade_price']))
                if lo is None or lo>30:continue
                records.append([code,stamp,round(lo,4),round(close or 0,4),
                    bar['low_price'],bar['trade_price'],continuous,
                    'RSI_PRICE_ONLY_NOT_VERIFIED_RANK_OR_15S_12S_OR_FRESH_BOOK'])
            except Exception as exc:
              errors.append((code,type(exc).__name__+':'+str(exc)[:80]))
            if index%40==0:print('PROGRESS',index,'/',len(krw),'POSSIBLE_RSI_LOW_CROSSES',len(records),'HTTP_ERRORS',len(errors))
          records.sort(key=lambda x:(x[2],x[0],x[1]))
          with (OUT/'20261116_upbit_5m_rsi30_possible_not_trading_proof.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f);w.writerow(['market','bar_start_kst','wilder_rsi20_at_bar_low','wilder_rsi20_at_bar_close','bar_low','bar_close','preceding_bar_5m_contiguous','interpretation']);w.writerows(records)
          with (OUT/'20261116_upbit_scan_http_errors.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f);w.writerow(['market','error']);w.writerows(errors)
          uniques=sorted(set(x[0] for x in records))
          print('RESULTS',len(records),'UNIQUE_MARKETS',len(uniques),'HTTP_ERRORS',len(errors))
          print('TOP20_POSSIBLE_RSI_PRICE_SIGNALS',records[:20])
          print('KRW_DRV_RELEVANT',[x for x in records if x[0]=='KRW-DRV' and '10:45' in x[1]][:3])
          print('NOT_POSSIBLE_TO_PROVE_APP_HISTORICAL_RANK_LATCH_BOOK_SUBSCRIPTIONS_OR_FILL_WITH_PUBLIC_OHLC')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_V074_20261116_UPBIT_PUBLIC_RSI20_PRICE_ONLY_SCAN
          path: market_audit/*.csv
          retention-days: 30
          if-no-files-found: error
