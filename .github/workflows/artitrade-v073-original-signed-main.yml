name: ARTITRADE v0.7.73 Original Signed GMO Exit and Full-Market Feed Repair
on:
  push:
    branches: [ artitrade-phone-main-v070-live-orders-20261112 ]
    paths: [ '.github/workflows/artitrade-v073-original-signed-main.yml' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artitrade-v073-original-signed-main
  cancel-in-progress: false
jobs:
  verified-original-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CI: 'true'
      SOURCE: 'bf42daa6e43ec08fa56b9791f14a5cd8d7503d62'
      ARTIFACT: 'ARTITRADE_UNIFIED_v0.7.73_20261116'
      TAG: 'ARTITRADE-v0.7.73-20261116'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'bf42daa6e43ec08fa56b9791f14a5cd8d7503d62'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore original signed-app certificate only
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Prove exact installed-app certificate identity before touching build
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.cache-hit }}" = "true"
          test -f "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6"
      - name: Verify SHA-pinned bundled Python and extract to temporary QA directory only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          z=base64.b64decode(''.join((p/('part_%02d.txt'%i)).read_text() for i in range(22)))
          assert ('CORE_SHA256="'+hashlib.sha256(z).hexdigest()+'"') in Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          t=Path('/tmp/artitrade-core-verified');t.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(z)) as f:f.extractall(t)
          from pathlib import Path
          g=(t/'projectgmo/engine.py').read_text()
          assert 'entry_profit_floor: float = 0.02' in g
          assert 'ENTRY_PLUS2_FLOOR' in g
          d=(t/'d_live.py').read_text()
          assert 'ping_timeout=45' in d and 'await asyncio.to_thread(_persist_universe_db)' in d
          assert "self._v071_enqueue_feed('raw',msg)" in d
          assert 'async def _v071_background_preload' in d and 'V071_KRX_0B_SILENT_45S_RECONNECT' not in d
          assert "self._health('실시간 연결됨','키움 REG 승인" in d
          assert 'elif not ack_group and seen_reg_acks < expected_reg_acks:' in d
          ui=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java').read_text()
          quote=Path('ARTITRADE_ANDROID/app/src/main/python/stock_quote_truth_v066.py').read_text()
          assert 'KIWOOM_REST_KA10001' in quote and "api.post('ka10001'" in quote
          assert 'stock_quote_display_price' in ui
          assert '실시간 미수신' not in ui
          gmo=(t/'d_gmo_runtime.py').read_text()
          assert 'self.engine.on_quote(q)' in gmo and 'def holding_codes(self)' in gmo
          assert 'self.gmo.holding_codes()' in d
          assert "'LAST_LEDGER'" in quote and "REST_REFRESH_SECONDS=35.0" in quote
          assert 'market_trend_watch' in ui and 'entry_block_reasons' in ui
          ma=Path('ARTITRADE_ANDROID/app/src/main/python/ma_v067_stock_runtime.py').read_text()
          lane=ma.split('    def observe_live(self,tick):',1)[1].split('    d_live.LivePaperRunner._new_tick=observe_live',1)[0]
          assert lane.index('q.put_nowait(tuple(tick))') < lane.index('return orig_feed(self,tick)')
          print('VERIFIED_V073_GMO_LIVE_CALLBACK_RSI_WATCH_MA_PRIORITY_AND_DISPLAY_PROVENANCE')
          PY
      - name: Run MA, Market Trend, GMO legacy and v067 broker-independent regression
        shell: bash
        env:
          PYTHONPATH: '/tmp/artitrade-core-verified:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          for pat in 'test_v073_*.py' 'test_v072_*.py' 'test_v071_*.py' 'test_v069_*.py' 'test_v063_*.py' 'test_v051_*.py' 'test_v068_*.py' 'test_v067_*.py' 'test_v066_*.py' 'test_v064_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -v
          done
      - name: Enable KVM for Android 15 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build executable x86_64 APKs for isolated emulator UI smoke
        env:
          ARTITRADE_EMULATOR_ABI: x86_64
        working-directory: ARTITRADE_ANDROID
        run: |
          gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
          mkdir -p ../downloaded-apks
          cp app/build/outputs/apk/unified/debug/app-unified-debug.apk ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_x86_64.apk
          ARTITRADE_EMULATOR_FIXTURE=1 gradle --no-daemon :app:assembleUnifiedDebug --rerun-tasks --stacktrace
          cp app/build/outputs/apk/unified/debug/app-unified-debug.apk ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_FIXTURE_x86_64.apk
      - name: Boot Android 15 and verify eight strategy screens, warm return and research
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ARTITRADE_ANDROID/ui_tests/android_emulator_smoke_v054.py
      - name: Rebuild actual Samsung ARM64 signed update from same pinned source
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleUnifiedDebug --rerun-tasks --stacktrace
      - name: Verify package, monotonic version, ABI, original signing cert and SHA
        shell: bash
        run: |
          set -euo pipefail
          apk='ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='79' versionName='0.7.73-GMO-EXIT-WATCH-QUOTE'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" >/tmp/v067-signer.txt
          grep -F '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/v067-signer.txt
          unzip -l "$apk" | grep -F 'assets/chaquopy/app.imy'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/'
          cp "$apk" "$ARTIFACT.apk"
          sha256sum "$ARTIFACT.apk" >"$ARTIFACT.sha256"
          printf 'source=%s\npackage=com.artitrade.unified.s21dex\nversionCode=79\nversionName=v0.7.73\noriginal_signing_certificate_sha256=37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6\ngmo_policy=v062\nLIVE_broker_fills_verified=false\n' "$SOURCE" >"$ARTIFACT.compatibility.txt"
      - name: Upload independently verified original-signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_UNIFIED_v0.7.73_20261116
          path: |
            ARTITRADE_UNIFIED_v0.7.73_20261116.apk
            ARTITRADE_UNIFIED_v0.7.73_20261116.sha256
            ARTITRADE_UNIFIED_v0.7.73_20261116.compatibility.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK as clearly marked prerelease only after all verifications
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ARTIFACT.apk" "$ARTIFACT.sha256" "$ARTIFACT.compatibility.txt" --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "ARTITRADE v0.7.73 (verified test build)" --notes "v0.7.73: restored missing live-GMO-service to original Engine.on_quote exit-decision callback, including previously agreed entry+2% protection; all held GMO positions use fresh-tick priority lane, stale ticks cannot cause synthetic or backdated orders. Stock MA verified near-close ticks reach independent priority worker before general strategy processing. Market Trend genuine RSI20 <=35 WATCH_PENDING shows in UI separately from executable broker orders and preserves actual observation for bounded TTL; missing trade/book and missed deadlines remain visible and fail closed. Stock UI immediately shows clearly labelled last stored evaluation, replacing it with verified WS 0B or official Kiwoom ka10001 REST; separate quote HTTP lock avoids contention with historical candle downloads. Retains original signing certificate, package and unrelated trading policy, existing settings/SQLite, original 3-second execution book freshness and all other original strategy thresholds. Full emulator and broker-independent regression only. LIVE broker order fills, Kiwoom/Upbit long-running connectivity and individual missed opportunities have NOT been verified." --prerelease
      - name: Upload Android 15 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_V073_ANDROID15_SIGNED_SOURCE_EVIDENCE
          path: ui-smoke/**
          retention-days: 14
          if-no-files-found: ignore
