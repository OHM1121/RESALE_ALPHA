name: Diagnose Nov 16 MPLX MA signals from official 5m and one-second prints
on:
  push:
    branches: [ diagnose-mplx-markettrend-20261116 ]
    paths: [ '.github/workflows/diagnose-mplx-ma-20261116.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check stock-independent MA conditions at MPLX 10:55 / 11:00, not place orders
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse,json,datetime as dt,sys
          sys.path.insert(0,'ARTITRADE_ANDROID/app/src/main/python')
          import ma_v067_policy as pol
          def pull(url,params):
              url=url+'?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Historical-ARTITRADE-MA-Audit/1.0'}),timeout=15) as r:return json.load(r)
          m=pull('https://api.upbit.com/v1/candles/minutes/5',{'market':'KRW-MPLX','count':200,'to':'2026-11-16T02:05:00Z'})
          series=sorted(m,key=lambda x:x['candle_date_time_kst'])
          for start,sec_end in [('2026-11-16T10:50:00','2026-11-16T01:54:56Z'),('2026-11-16T10:55:00','2026-11-16T01:59:56Z')]:
              h=[{'open':z['opening_price'],'close':z['trade_price'],'high':z['high_price'],'low':z['low_price']} for z in series if z['candle_date_time_kst']<=start]
              prev=[float(z['trade_price']) for z in series if z['candle_date_time_kst']<start]
              seconds=pull('https://api.upbit.com/v1/candles/seconds',{'market':'KRW-MPLX','to':sec_end,'count':40})
              latest=seconds[0] if seconds else None
              # Use 10:54:55 or 10:59:55; request excludes 10:54:56 / 10:59:56
              target=dt.datetime.fromisoformat(sec_end.replace('Z','+00:00')).timestamp()-1
              stamp=dt.datetime.fromisoformat(latest['candle_date_time_utc']+'+00:00').timestamp() if latest else None
              age=target-stamp if stamp is not None else None
              px=float(latest['trade_price']) if latest else None
              bearish=pol.bear_reversal_completed(h,'5m')
              up=pol.upward_transition_on_forming(prev,px,5) if px is not None else {'reason':'NO_TRADE'}
              row=next(x for x in series if x['candle_date_time_kst']==start)
              body=(row['opening_price']-row['trade_price'])/row['opening_price']*100
              print('MA_BAR',start,'BODY_DROP_PERCENT',round(body,5),'BEAR_VERDICT',bearish,'UP_FORMING_VERDICT',up,'LAST_TRADE_SECOND',latest['candle_date_time_kst'] if latest else None,'PRICE',px,'AGE_AT_CLOSE_MINUS_5_S',age)
          PY