name: ARTITRADE v0.7.63 Android 15 boot and eight-screen smoke
on:
  push:
    branches: [ feature-artitrade-v063-kiwoom-gmo-lifecycle-audit-20261116 ]
    paths:
      - 'ARTITRADE_ANDROID/ui_tests/android_emulator_smoke_v054.py'
      - 'ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java'
      - 'ARTITRADE_ANDROID/app/src/main/assets/strategy_v070/**'
      - 'ARTITRADE_ANDROID/app/build.gradle'
      - 'ARTITRADE_ANDROID/app/src/main/python/reference_integrity_v059.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v061_rules.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v061_stock_runtime.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v061_coin_runtime.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_epoch_v062.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v062_ai_scope.py'
      - '.github/workflows/artitrade-v063-android15-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artitrade-v063-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout exact Android source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore stable APK signing key for emulator build
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Create non-production signing key if cache is unavailable
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=ARTITRADE Emulator Test,O=ARTITRADE,C=KR" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build executable x86_64 emulator variant from same source
        env:
          ARTITRADE_EMULATOR_ABI: x86_64
        working-directory: ARTITRADE_ANDROID
        run: |
          gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
          mkdir -p ../downloaded-apks
          cp app/build/outputs/apk/unified/debug/app-unified-debug.apk ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_x86_64.apk
          # Rebuild the same source with service off only for the read-only
          # synthetic-data render phase. It is never a distributed APK.
          ARTITRADE_EMULATOR_FIXTURE=1 gradle --no-daemon :app:assembleUnifiedDebug --rerun-tasks --stacktrace
          cp app/build/outputs/apk/unified/debug/app-unified-debug.apk ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_FIXTURE_x86_64.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_FIXTURE_x86_64.apk AndroidManifest.xml | grep -A8 'UnifiedTradingService' | head -12
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_x86_64.apk | grep -E "package:|launchable-activity:"
      - name: Boot Android 15, install APK and exercise all 8 strategy screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ARTITRADE_ANDROID/ui_tests/android_emulator_smoke_v054.py
      - name: Upload screenshots and AndroidRuntime evidence even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_V063_ANDROID15_EMULATOR_EVIDENCE
          path: ui-smoke/**
          retention-days: 14
          if-no-files-found: ignore
