name: ARTITRADE v0.7.58 regression and ORIGINAL-certificate signed APK
on:
  push:
    branches:
      - feature-artitrade-v058-evidence-rsi-gates-20261116
    paths:
      - '.github/workflows/artitrade-v058-original-signed.yml'
      - 'ARTITRADE_ANDROID/app/src/main/python/**'
      - 'ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java'
      - 'ARTITRADE_ANDROID/ui_tests/test_v058_evidence_rsi.py'
      - 'ARTITRADE_ANDROID/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artitrade-v058-original-cert-release
  cancel-in-progress: true
jobs:
  tests-and-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Python syntax and isolated trading regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          for pattern in 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pattern" -v
          done
      - name: Restore original update-compatible signing certificate
        uses: actions/cache/restore@v4
        id: signer
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Reject missing or rotated signing identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signer.outputs.cache-hit }}" = "true" || {
            echo "ORIGINAL_SIGNING_CACHE_UNAVAILABLE"; exit 1;
          }
          test -f "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6" || {
            echo "ORIGINAL_SIGNING_CERTIFICATE_MISMATCH"; exit 1;
          }
      - name: Android build using original certificate
        env:
          CI: 'true'
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Verify signed APK and prepare individual deliverable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='65' versionName='0.7.58-AI-EVIDENCE-RSI'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /tmp/cert.txt
          grep -F "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6" /tmp/cert.txt
          cp "$apk" release/ARTITRADE_UNIFIED_v0.7.58_20261116.apk
          (cd release && sha256sum ARTITRADE_UNIFIED_v0.7.58_20261116.apk > ARTITRADE_UNIFIED_v0.7.58_20261116.sha256)
          printf 'versionName=v0.7.58\nversionCode=65\npackage=com.artitrade.unified.s21dex\noriginal_certificate_sha256=37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6\n' > release/ARTITRADE_UNIFIED_v0.7.58_20261116.compatibility.txt
          cat release/ARTITRADE_UNIFIED_v0.7.58_20261116.sha256
      - name: Upload directly installable signed APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_UNIFIED_v0.7.58_20261116
          path: release/*
          if-no-files-found: error
          retention-days: 30
