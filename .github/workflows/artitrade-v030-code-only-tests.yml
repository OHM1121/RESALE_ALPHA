name: ARTITRADE v030 code-only tests (no APK/EXE)
on:
  push:
    branches:
      - artitrade-v030-pc-live-preload-bundle-code-only-20261114
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v030-code-only-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify new Python code and read-only research bundles
        run: |
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/pc_tools
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v030_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/pc_tools -p 'test_live_research_mirror.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_reader.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
      - name: Verify JVM sync policy and swipe boundaries without Android packaging
        run: |
          mkdir -p /tmp/artitrade-v030-jvm
          javac -d /tmp/artitrade-v030-jvm \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/PcLiveSyncPolicy.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategySwipeThreshold.java \
            ARTITRADE_ANDROID/ui_tests/PcLiveSyncPolicyTest.java \
            ARTITRADE_ANDROID/ui_tests/StrategySwipeThresholdTest.java
          java -cp /tmp/artitrade-v030-jvm com.artitrade.mobile.PcLiveSyncPolicyTest
          java -cp /tmp/artitrade-v030-jvm com.artitrade.mobile.StrategySwipeThresholdTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android native code without packaging an APK
        run: |
          cd ARTITRADE_ANDROID
          gradle --no-daemon :app:compileUnifiedDebugJavaWithJavac
          test ! -d app/build/outputs/apk
      - name: Confirm no Android installer artifacts created
        run: |
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
