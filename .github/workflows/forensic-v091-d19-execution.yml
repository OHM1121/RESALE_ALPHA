name: V091 D19 true executable engine and Windows startup reconciliation
on:
  push:
    branches: [fix-artitrade-v091-stock-at-exit-root-cause-portrait-20261118]
    paths: [.github/workflows/forensic-v091-d19-execution.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python3 - <<'PY'
          import base64,zipfile,io,ast
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          data=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            sections={
              'd_v19_portfolio.py':[(200,275),(450,615),(1300,1610)],
              'd_engine.py':[(173,199),(545,558),(677,710)],
              'd_upbit.py':[(1290,1355),(2095,2140),(2530,2555),(3681,3735)],
              'd_live.py':[(521,545),(1527,1574),(1925,1975),(2180,2215)]
            }
            for filename,ranges in sections.items():
              l=z.read(filename).decode().splitlines()
              print('== FILE',filename,'LENGTH',len(l),flush=True)
              for a,b in ranges:
                for i in range(a-1,min(b,len(l))):
                  print('Q',filename,i+1,l[i][:350])
          PY
