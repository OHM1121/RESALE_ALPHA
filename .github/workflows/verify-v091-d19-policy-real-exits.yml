name: V091 reproduce and repair genuine stock AT D19 missing three-leg exits and portrait PnL
on:
  push:
    branches: [fix-artitrade-v091-stock-at-exit-root-cause-portrait-20261118]
    paths:
      - .github/workflows/verify-v091-d19-policy-real-exits.yml
      - ARTITRADE_ANDROID/app/src/main/python/stock_at_policy_reconcile_v091.py
      - ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
      - ARTITRADE_ANDROID/ui_tests/test_v091_d19_original_at_reconnect_and_portrait.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  d19-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/v091-original-exe-core')
          PY
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/v091-original-exe-core:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_d19_original_at_reconnect_and_portrait.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_at_native_catchup.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_stock_manual_all.py' -v
