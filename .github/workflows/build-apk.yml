name: Build RESALE ALPHA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/resale_alpha_ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/resale_alpha_ui.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RESALE_ALPHA_MOBILE_V0_4_1_SAFE_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
