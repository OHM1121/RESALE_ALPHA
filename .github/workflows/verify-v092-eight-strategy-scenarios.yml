name: V092 prove 8-strategy outage/missing-candle scenario planning without fake fills
on:
  push:
    branches: [fix-artitrade-v092-unified-recovery-scenarios-ui-20261118]
    paths:
      - .github/workflows/verify-v092-eight-strategy-scenarios.yml
      - ARTITRADE_ANDROID/app/src/main/python/unified_recovery_v092.py
      - ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
      - ARTITRADE_ANDROID/ui_tests/test_v092_scenarios_8_wallets.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/v092-original-exe-core')
          PY
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/v092-original-exe-core:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v092_scenarios_8_wallets.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_d19_original_at_reconnect_and_portrait.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_at_native_catchup.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_stock_manual_all.py' -v
          python3 - <<'PY'
          import android_runtime_v078 as runtime
          import d_live,d_upbit
          from unified_recovery_v092 import HeldFirstQueue
          # Ensure effective EXE callbacks are patched at Android import,
          # but no live API, broker account or user SQL is touched.
          import android_live_bridge as core
          assert 'unified_recovery_v092' in core.Runtime.snapshot.__code__.co_filename
          assert 'unified_recovery_v092' in d_live.LivePaperRunner.__init__.__code__.co_filename
          assert 'unified_recovery_v092' in d_upbit.UpbitPaperRunner._v084_accept_tick.__code__.co_filename
          print('V092_ANDROID_NATIVE_ENGINE_INSTALL_PASS')
          PY