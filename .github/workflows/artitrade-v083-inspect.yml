name: ARTITRADE v083 native Upbit WS bounded source inspection
on:
  push:
    branches: [ fix-artitrade-v083-upbit-trend-ws-20261116 ]
    paths: [ '.github/workflows/artitrade-v083-inspect.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SHA-verified immutable native Upbit feed and scheduling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,io,zipfile,re
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          parts=root/'assets/strategy_v070'
          blob=base64.b64decode(''.join((parts/f'part_{i:02d}.txt').read_text() for i in range(22)))
          java=(root/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert 'CORE_SHA256="'+hashlib.sha256(blob).hexdigest()+'"' in java
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              assert archive.testzip() is None
              src=archive.read('d_upbit.py').decode()
              other=archive.read('android_live_bridge.py').decode()
          lines=src.splitlines()
          print('CORE_SHA=',hashlib.sha256(blob).hexdigest(),'d_upbit_lines=',len(lines))
          code=ast.parse(src)
          for n in ast.walk(code):
              if isinstance(n,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)) and any(s in n.name.lower() for s in ('ws','book','watch','enqueue','universe','scan','rest','tracked','run','consume','quote','tick','subscribe')):
                  print('FUNCTION',n.name,n.lineno,n.end_lineno)
          pattern=re.compile(r'ping_|max_queue|orderbook|ticker|\.recv\(|_ws_|_both_watched|_ensure_ws|_enqueue_ws|_ws_connected|_ws_last_frame|_last_ws_quote|codes=frozenset|next_codes=|next_bids=',re.I)
          hits=[i for i,line in enumerate(lines) if pattern.search(line)]
          groups=set()
          for i in hits:
              groups.update(range(max(0,i-2),min(len(lines),i+3)))
          print('==== NATIVE HITS (bounded) ====')
          for i in sorted(groups):
              print(f'NATIVE:{i+1:04d}: {lines[i][:240]}')
          print('==== 0B/0D/UPBIT SUB RELEVANT OVERLAY ====')
          overlay=(root/'python/market_trend_runtime_v043.py').read_text().splitlines()
          for a,b in ((310,355),(1180,1245),(1630,1650)):
              for i in range(a-1,min(len(overlay),b)):
                  print(f'OVERLAY:{i+1:04d}: {overlay[i][:230]}')
          PY
