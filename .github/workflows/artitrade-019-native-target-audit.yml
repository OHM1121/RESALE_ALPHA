name: ARTITRADE 0.0.19 inspect original GMO and CW target contracts
on:
  push:
    branches: [artitrade-019-eight-wallet-target-plan-display-20261119]
    paths: [.github/workflows/artitrade-019-native-target-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-target-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify and enumerate original 82 embedded modules
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,re
          from pathlib import Path
          base=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((base/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              entries=z.namelist()
              print('ORIGINAL_NATIVE_TARGET_INVENTORY',len(entries),
                    [x for x in entries if 'gmo' in x.lower() or 'close' in x.lower()])
              for name in entries:
                  if not name.endswith('.py') or not any(k in name.lower() for k in ('gmo','close')):continue
                  data=z.read(name).decode('utf8').splitlines()
                  wanted=[i for i,s in enumerate(data) if re.search(
                      r'first_profit|first_target|first_filled|target_price|target_gain|second_|first_|sell_fraction|profit_pct|profit_rate|target_pct|target_profit|sell_target|target\s*=',s,re.I)]
                  print('NATIVE_CONTRACT_FILE',name,'TOTAL_LINES',len(data),'HITS',len(wanted))
                  printed=set()
                  for i in wanted[:55]:
                      for n in range(max(0,i-3),min(len(data),i+6)):
                          if n not in printed:
                              printed.add(n)
                              print(f'LINE {n+1}: '+data[n][:240])
                  print('END_NATIVE_FILE',name)
          PY
