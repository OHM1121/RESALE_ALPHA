name: ARTITRADE 8 original strategies entry exit audit - NO APK
on:
  push:
    branches: [artitrade-v106-fresh-paper-ledger-reset-source-only]
    paths:
      - .github/workflows/artitrade-v003-eight-strategy-policy-audit-no-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-original-strategy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read EXACT bundled original EXE policy and Android overlays (no binary build)
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,base64,io,re,zipfile
          from pathlib import Path
          asset=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          parts=[(asset/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)]
          raw=base64.b64decode(''.join(parts))
          z=zipfile.ZipFile(io.BytesIO(raw))
          files=z.namelist()
          print('ORIGINAL_ASSET_FILES',len(files))
          print('STRATEGY_SOURCE_FILE_INDEX_START')
          for f in files:
              if f.endswith('.py') and re.search(r'd_engine|d_v19|d_upbit|close|gmo|ma|portfolio|strategy|signal|entry|exit|policy|wallet|candle',f,re.I):
                  print('ORIGINAL_SOURCE',f)
          print('STRATEGY_SOURCE_FILE_INDEX_END')
          wanted=('d_engine.py','d_v19_portfolio.py','d_upbit.py',
                  'stock_ma_engine.py','coin_ma_engine.py',
                  'at_close_engine.py','at_close_runner.py',
                  'projectgmo/engine.py','d_gmo_runtime.py',
                  'reference_policy.py','coin_hold_policy.py',
                  'sr_exit.py')
          for f in wanted:
              if f not in files:continue
              a=z.read(f).decode('utf8').splitlines()
              t=ast.parse('\n'.join(a),filename=f)
              print('BEGIN_STRATEGY_FILE',f,'LINES',len(a))
              count=0
              for node in ast.walk(t):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                  if not re.search(r'buy|sell|exit|stop|target|signal|candidate|enter|entry|tick|match|watch|cross|close|decide|portfolio',node.name,re.I):continue
                  if node.end_lineno-node.lineno>310:continue
                  print('POLICY_METHOD',f,node.name,node.lineno,node.end_lineno)
                  for i in range(node.lineno-1,min(node.end_lineno,node.lineno+92)):
                      line=a[i]
                      if re.search('(?i)(api[_-]?key|password|secret|private[_-]?key|token)\\s*[:=]',line):continue
                      print(f'SRC {f} {i+1} {line[:200]}')
                  count+=1
                  if count>=28:break
              print('END_STRATEGY_FILE',f)
          print('ORIGINAL_SOURCE_ONLY_NO_APK')
          PY
      - name: Analyze original CW GMO coin MA and coin general sell policy constants
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zipfile,io,ast,re
          from pathlib import Path
          root=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(''.join(
            (root/f"part_{i:02d}.txt").read_text('ascii') for i in range(22)))))
          paths=("at_close_engine.py","at_close_runner.py",
                 "projectgmo/engine.py","d_gmo_runtime.py",
                 "coin_ma_engine.py","coin_hold_policy.py",
                 "coin_v24_policy.py","d_upbit.py","sr_exit.py",
                 "reference_policy.py")
          wanted=re.compile(r"(?i)buy|sell|entry|exit|target|stop|hold|profit|cut|candidate|close|trail|risk|level|day|signal")
          for path in paths:
              lines=z.read(path).decode("utf8").splitlines()
              t=ast.parse("\n".join(lines),path)
              print("POLICY_CONFIG_FILE_BEGIN",path,"LINES",len(lines))
              for i,line in enumerate(lines[:240],1):
                  stripped=line.strip()
                  if (re.search(r"^[A-Z][A-Z0-9_]{2,}\s*=",stripped) or
                      "Config(" in stripped or "ExitPolicy" in stripped):
                      print("POLICY_CONSTANT",path,i,stripped[:180])
              functions=[]
              for node in ast.walk(t):
                  if (isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and
                      wanted.search(node.name)):
                      functions.append(node)
              for node in functions[:60]:
                  print("POLICY_FUNCTION",path,node.name,node.lineno,node.end_lineno)
                  for i in range(node.lineno-1,min(node.end_lineno,node.lineno+22)):
                      line=lines[i]
                      if re.search("(?i)(api[_-]?key|password|secret|private[_-]?key|token)\\s*[:=]",line):continue
                      print("RULE",path,i+1,line[:170])
              print("POLICY_CONFIG_FILE_END",path)
          PY
      - name: Exact close betting, coin V26, GMO exit threshold source excerpts
        shell: bash
        run: |
          python3 - <<'PY'
          import io,zipfile,base64
          from pathlib import Path
          root=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          data=base64.b64decode(''.join((root/f"part_{i:02d}.txt").read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              targets={
                  "at_close_engine.py":[(1,70),(130,215)],
                  "coin_v24_policy.py":[(1,125)],
                  "projectgmo/engine.py":[(1,75),(426,610)],
                  "d_gmo_runtime.py":[(500,630),(630,780)],
                  "coin_ma_engine.py":[(1,120),(154,270)],
                  "d_upbit.py":[(2020,2250),(2700,2720)],
                  "d_engine.py":[(1115,1218)],
                  "d_v19_portfolio.py":[(1370,1518)],
              }
              for name,intervals in targets.items():
                  a=z.read(name).decode('utf8').splitlines()
                  print("EXACT_POLICY_SOURCE_BEGIN",name)
                  for i,j in intervals:
                      for n in range(i,min(j+1,len(a)+1)):
                          line=a[n-1].rstrip()
                          if len(line)>210:line=line[:210]
                          if any(x in line.lower() for x in ("api_key=","password=","client_secret=")):continue
                          print("EXACT",name,n,line)
                  print("EXACT_POLICY_SOURCE_END",name)
          PY
      - name: Exact coin general and coin MA exit cases, CW candidate and stock AT stages
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          root=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(''.join(
             (root/f"part_{i:02d}.txt").read_text('ascii') for i in range(22))))) as z:
              for f,a,b in (
                  ("coin_v24_policy.py",380,583),
                  ("coin_ma_engine.py",155,305),
                  ("at_close_runner.py",140,365),
                  ("d_v19_portfolio.py",915,1070),
                  ("d_engine.py",1116,1217),
                  ("projectgmo/engine.py",111,154),
              ):
                  lines=z.read(f).decode('utf8').splitlines()
                  print("FINAL_POLICY_RANGE_START",f,a,b)
                  for i in range(a-1,min(b,len(lines))):
                      v=lines[i].rstrip()
                      if any(x in v.lower() for x in ("api_key=","password=","private_key=")):continue
                      print("FINAL_POLICY",f,i+1,v[:210])
                  print("FINAL_POLICY_RANGE_END",f)
          PY
      - name: Confirm no APK
        run: test ! -e ARTITRADE_ANDROID/app/build/outputs/apk
