name: ARTITRADE 8 original strategies entry exit audit - NO APK
on:
  push:
    branches: [artitrade-v106-fresh-paper-ledger-reset-source-only]
    paths:
      - .github/workflows/artitrade-v003-eight-strategy-policy-audit-no-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-original-strategy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read EXACT bundled original EXE policy and Android overlays (no binary build)
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,base64,io,re,zipfile
          from pathlib import Path
          asset=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          parts=[(asset/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)]
          raw=base64.b64decode(''.join(parts))
          z=zipfile.ZipFile(io.BytesIO(raw))
          files=z.namelist()
          print('ORIGINAL_ASSET_FILES',len(files))
          print('STRATEGY_SOURCE_FILE_INDEX_START')
          for f in files:
              if f.endswith('.py') and re.search(r'd_engine|d_v19|d_upbit|close|gmo|ma|portfolio|strategy|signal|entry|exit|policy|wallet|candle',f,re.I):
                  print('ORIGINAL_SOURCE',f)
          print('STRATEGY_SOURCE_FILE_INDEX_END')
          wanted=('d_engine.py','d_v19_portfolio.py','d_upbit.py',
                  'stock_ma_engine.py','coin_ma_engine.py',
                  'at_close_engine.py','at_close_runner.py',
                  'projectgmo/engine.py','d_gmo_runtime.py',
                  'reference_policy.py','coin_hold_policy.py',
                  'sr_exit.py')
          for f in wanted:
              if f not in files:continue
              a=z.read(f).decode('utf8').splitlines()
              t=ast.parse('\n'.join(a),filename=f)
              print('BEGIN_STRATEGY_FILE',f,'LINES',len(a))
              count=0
              for node in ast.walk(t):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                  if not re.search(r'buy|sell|exit|stop|target|signal|candidate|enter|entry|tick|match|watch|cross|close|decide|portfolio',node.name,re.I):continue
                  if node.end_lineno-node.lineno>310:continue
                  print('POLICY_METHOD',f,node.name,node.lineno,node.end_lineno)
                  for i in range(node.lineno-1,min(node.end_lineno,node.lineno+92)):
                      line=a[i]
                      if re.search('(?i)(api[_-]?key|password|secret|private[_-]?key|token)\\s*[:=]',line):continue
                      print(f'SRC {f} {i+1} {line[:200]}')
                  count+=1
                  if count>=28:break
              print('END_STRATEGY_FILE',f)
          print('ORIGINAL_SOURCE_ONLY_NO_APK')
          PY
      - name: Confirm no APK
        run: test ! -e ARTITRADE_ANDROID/app/build/outputs/apk
