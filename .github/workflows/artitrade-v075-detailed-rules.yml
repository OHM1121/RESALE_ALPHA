name: ARTITRADE v075 selector, CW and Gmo entry exact rules
on:
  push:
    branches: [fix-artitrade-v075-gmo-cw-audit-20261116]
    paths: ['.github/workflows/artitrade-v075-detailed-rules.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact selected modules and static rule flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,zipfile,ast,re
          a=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          b=base64.b64decode(''.join((a/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            print('=== ALL_BUNDLED_PY_FILES ===')
            print('\n'.join(x for x in z.namelist() if x.endswith('.py')))
            for filename in ['projectgmo/selector.py','projectgmo/scoring.py','projectgmo/flow_adapter.py','projectgmo/d_bridge.py']:
              raw=z.read(filename).decode()
              print('=== FULL_MODULE',filename,'===')
              for i,line in enumerate(raw.splitlines(),1):print('LINE',i,line[:450])
            for name in z.namelist():
              if not name.endswith('.py') or not re.search(r'cw|close|bet|auction|krx',name,re.I):continue
              print('=== CW_MODULE',name,'===')
              src=z.read(name).decode();root=ast.parse(src)
              for node in ast.walk(root):
                if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  print('METHOD',node.name,node.lineno,node.end_lineno)
              for i,l in enumerate(src.splitlines(),1):
                if re.search(r'buy|entry|candidate|signal|ratio|turnover|amount|open|close|time|score|auction|flow|prev|volume|percent|kospi|kosdaq',l,re.I):
                  print('HIT',i,l[:300])
          PY
