name: ARTITRADE 0.0.8 special KRX and Trend source regression (NO APK)
on:
  push:
    branches:
      - fix-artitrade-008-specialsession-trend-proof-20261119
    paths:
      - ARTITRADE_ANDROID/app/build.gradle
      - ARTITRADE_ANDROID/app/src/main/python/**
      - ARTITRADE_ANDROID/ui_tests/**
      - docs/artitrade/**
      - tools/artitrade/**
      - .github/workflows/artitrade-008-special-session-trend-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile overlay and test source
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
      - name: Prepare original vendor Python read-only fixture
        run: |
          set -euo pipefail
          python3 -m pip install -q requests==2.32.5 websockets==15.0.1 holidays
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,ast
          from pathlib import Path
          original=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          b=base64.b64decode(''.join((original/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          assert hashlib.sha256(b).hexdigest()=='b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb'
          with zipfile.ZipFile(io.BytesIO(b)) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  if name.endswith('.py'):
                      ast.parse(archive.read(name).decode('utf8'),filename=name)
              archive.extractall('/tmp/artitrade-v008-original')
          print('ORIGINAL_VENDOR_READ_ONLY_SHA_VERIFIED')
          PY
      - name: Test GMO delayed KRX and disabled NXT premarket
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v008-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v097_gmo_preplan.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v093_strategy_subscription_priority.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v008_all_strategy_rootcause.py' -v
      - name: Test 30m missing-bar RSI watch source and NEW LEGACY
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v008-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v008_special_session_trend_proof.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v008_bollinger_pixel_geometry.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v008_broker_sell_receipt.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_new_legacy_1118_workbook.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v002_eight_virtual_paper_end_to_end.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v002_post_reset_trend_and_top50.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v006_trend_5m_retirement_and_startup.py' -v
      - name: Enforce issue register and dependency map
        run: |
          set -euo pipefail
          python3 tools/artitrade/build_source_graph.py --output artitrade_source_graph.json
          python3 tools/artitrade/validate_dependency_contracts.py --generated artitrade_source_graph.json
      - name: Assert no APK was created
        run: test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
  java-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile original Java bridge
        run: |
          gradle -p ARTITRADE_ANDROID :app:compileUnifiedDebugJavaWithJavac --no-daemon --stacktrace
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
