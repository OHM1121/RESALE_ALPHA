name: ARTITRADE v040 Live Research Evidence, Strategy Scope and AI Visual CI
on:
  push:
    branches: [feature-artitrade-v040-ai-live-evidence-visual-20261114]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v040-code-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artitrade-v040-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Run v039 and prior strategy regressions
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v040_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v039_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v038_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v037_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v036_*.py' -v
          mkdir -p /tmp/artitrade-v036
          javac -d /tmp/artitrade-v036 \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistorySelection.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchScoreGrid.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchBandSelection.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ColumnQueryV036.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStatusV036.java \
            ARTITRADE_ANDROID/ui_tests/ResearchPopupV036Test.java \
            ARTITRADE_ANDROID/ui_tests/ColumnQueryV036Test.java \
            ARTITRADE_ANDROID/ui_tests/SyncStatusV036Test.java
          java -cp /tmp/artitrade-v036 com.artitrade.mobile.ResearchPopupV036Test
          java -cp /tmp/artitrade-v036 com.artitrade.mobile.ColumnQueryV036Test
          java -cp /tmp/artitrade-v036 com.artitrade.mobile.SyncStatusV036Test
      - name: Existing strategies remain intact
        run: |
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v035_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v034_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v033_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v031_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v028_trade_record_parity.py' -v
      - name: Inspect original EXE forward max provenance (read-only)
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,pathlib
          base=pathlib.Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          archive=base64.b64decode(''.join(p.read_text() for p in sorted(base.glob('part_*.txt'))))
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              for name in z.namelist():
                  if not name.endswith('.py'):continue
                  body=z.read(name).decode('utf8','replace').splitlines()
                  matches=[i for i,line in enumerate(body) if 'candidate_forward' in line or
                           ('max_price' in line and 'forward' in line)]
                  if matches:
                      print('SOURCE',name,'LINES',len(body),'MATCHES',len(matches))
                      for i in matches[:20]:
                          for j in range(max(0,i-2),min(len(body),i+3)):
                              print(f'{j+1}: {body[j][:220]}')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compile unified Android Java (no APK or EXE)
        run: |
          cd ARTITRADE_ANDROID
          gradle --no-daemon :app:compileUnifiedDebugJavaWithJavac
          test ! -d app/build/outputs/apk
