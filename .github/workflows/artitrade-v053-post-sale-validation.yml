name: ARTITRADE v0.7.53 Unified Safety Validation
on:
  push:
    branches:
      - feature-artitrade-v053-post-sale-high-20261115
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v053-post-sale-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artitrade-v053-update-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Test corrected GMO PAPER, settings, source provenance and historical regressions
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v053_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v052_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v051_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v050_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_research_persistence_full.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_android_ledger_backup.py' -v
          for V in v048 v047 v046 v045 v044 v043 v042 v041 v040 v039 v038 v037 v036 v035 v031; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "test_${V}_*.py" -v
          done
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v028_trade_record_parity.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v030_*.py' -v
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          mkdir -p /tmp/artitrade-v053-jvm
          javac -d /tmp/artitrade-v053-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SignedMarketScore.java ARTITRADE_ANDROID/ui_tests/SignedMarketScoreTest.java
          java -cp /tmp/artitrade-v053-jvm com.artitrade.mobile.SignedMarketScoreTest
          javac -d /tmp/artitrade-v053-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistorySelection.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchScoreGrid.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchBandSelection.java ARTITRADE_ANDROID/ui_tests/ResearchBandSelectionTest.java ARTITRADE_ANDROID/ui_tests/ResearchScoreGridTest.java
          java -cp /tmp/artitrade-v053-jvm com.artitrade.mobile.ResearchBandSelectionTest
          java -cp /tmp/artitrade-v053-jvm com.artitrade.mobile.ResearchScoreGridTest
          javac -d /tmp/artitrade-v053-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ColumnQueryV036.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStatusV036.java ARTITRADE_ANDROID/ui_tests/ColumnQueryV036Test.java ARTITRADE_ANDROID/ui_tests/SyncStatusV036Test.java
          java -cp /tmp/artitrade-v053-jvm com.artitrade.mobile.ColumnQueryV036Test
          java -cp /tmp/artitrade-v053-jvm com.artitrade.mobile.SyncStatusV036Test
      - name: Compile unified APK with test key (not distributable)
        working-directory: ARTITRADE_ANDROID
        env:
          CI: 'false'
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Verify test build metadata (do not install over production)
        run: |
          APK="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='60'"
          echo "Test-key build only. Production APK must use the original cached signing certificate."
