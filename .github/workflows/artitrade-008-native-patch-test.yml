name: ARTITRADE 0.0.8 native special-session patch, original 82 modules, no APK
on:
  push:
    branches: [fix-artitrade-008-specialsession-trend-proof-20261119]
    paths:
      - .github/workflows/artitrade-008-native-patch-test.yml
      - ARTITRADE_ANDROID/ui_tests/patch_v008_native_krx_special.py
      - ARTITRADE_ANDROID/app/src/main/python/krx_session_v041.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact ephemeral legacy patch sequence followed by 0.0.8 venue patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/build.gradle')
          s=p.read_text()
          assert s.count("versionCode 130")==1 and s.count("versionName '0.0.8'")==1
          p.write_text(s.replace("versionCode 130","versionCode 97").replace("versionName '0.0.8'","versionName '0.7.91-MA-STAGE-LEDGER'"))
          PY
          python3 ARTITRADE_ANDROID/ui_tests/patch_v092_realtime_ws_latency.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v093_strategy_priority_metadata.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v105_ka10004_readonly.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v008_native_krx_special.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,zipfile,hashlib,ast,datetime as dt,sys
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text() for i in range(22)))
          expected=hashlib.sha256(raw).hexdigest()
          sys.path[:0]=['ARTITRADE_ANDROID/app/src/main/python']
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              for path in z.namelist():
                  if path.endswith('.py'):ast.parse(z.read(path).decode(),filename=path)
              z.extractall('/tmp/artitrade-v008-native')
          sys.path.insert(0,'/tmp/artitrade-v008-native')
          from d_v19_portfolio import live_session
          from krx_session_v041 import venue_bounds
          tz=dt.timezone(dt.timedelta(hours=9))
          def at(day,h,m):return dt.datetime.fromisoformat(f'{day}T{h:02d}:{m:02d}:00+09:00')
          assert live_session(at('2026-11-19',9,59),'KRX') is False
          assert live_session(at('2026-11-19',10,0),'KRX') is True
          assert live_session(at('2026-11-19',16,29),'KRX') is True
          assert live_session(at('2026-11-19',16,30),'KRX') is False
          assert live_session(at('2026-11-19',8,15),'NXT') is False
          assert live_session(at('2026-11-18',9,0),'KRX') is True
          assert live_session(at('2026-11-18',15,30),'KRX') is False
          assert live_session(at('2027-11-19',9,0),'KRX') is True
          print('V008_NATIVE_SESSION_CONTRACT_PASS',expected)
          Path('/tmp/vendor_sha').write_text(expected)
          PY
          echo "ARTITRADE_APPROVED_VENDOR_PATCHED_SHA256=$(cat /tmp/vendor_sha)" >> "$GITHUB_ENV"
      - name: Re-run source graph against exact patched core
        run: |
          python3 tools/artitrade/build_source_graph.py --output /tmp/artitrade_graph.json
          python3 tools/artitrade/validate_dependency_contracts.py --generated /tmp/artitrade_graph.json
