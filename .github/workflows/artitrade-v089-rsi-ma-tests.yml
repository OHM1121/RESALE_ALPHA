name: ARTITRADE v089 RSI four frames and MA120 0.0099 tests
on:
  push:
    branches: [fix-artitrade-v089-rsi-ma-apk-20261117]
    paths: ['.github/workflows/artitrade-v089-rsi-ma-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Make embedded original strategy modules available in read-only temp directory
        shell: bash
        run: |
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,zipfile
          root=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          packed=base64.b64decode("".join((root/("part_%02d.txt"%i)).read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(packed)) as z:
              assert z.testzip() is None
              z.extractall("/tmp/v089-core")
          PY
      - name: Run RSI timeframe and MA limit regressions
        shell: bash
        run: |
          PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/v089-core" python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v089_rsi_ma120_correct_frame.py' -v
