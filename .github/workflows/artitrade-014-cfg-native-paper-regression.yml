name: ARTITRADE 0.0.14 CFG synthetic quote-gap and native PAPER 8-wallet replay
on:
  push:
    branches: [artitrade-014-cfg-simulated-exit-audit-20261119]
    paths:
      - ARTITRADE_ANDROID/app/src/main/python/**
      - ARTITRADE_ANDROID/ui_tests/test_v014_cfg_native_paper_exit_replay.py
      - ARTITRADE_ANDROID/ui_tests/test_v002_eight_virtual_paper_end_to_end.py
      - .github/workflows/artitrade-014-cfg-native-paper-regression.yml
      - docs/artitrade/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original runtime import dependencies
        run: python3 -m pip install -q requests==2.32.5 websockets==15.0.1 holidays
      - name: Verify signed baseline original bundle, never edit its source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,ast
          from pathlib import Path
          base=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          raw=base64.b64decode("".join((base/("part_%02d.txt"%i)).read_text("ascii") for i in range(22)))
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=="b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb",sha
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith(".py"):ast.parse(z.read(name).decode("utf8"),filename=name)
              z.extractall("/tmp/artitrade-014-original")
          print("ORIGINAL_NATIVE_SOURCE_VERIFIED",sha)
          PY
      - name: Compile overlays and run CFG quote-gap + all eight ORIGINAL native PAPER wallets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-014-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v014_cfg_native_paper_exit_replay.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v002_eight_virtual_paper_end_to_end.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v011_new_legacy_resting_and_legacy_retirement.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v012_legacy_purge_and_holding_frame.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v004_abnormal_reconnect_six.py' -v
      - name: Confirm no real broker call, Android device, or APK is claimed
        shell: bash
        run: |
          set -euo pipefail
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
          echo 'SYNTHETIC_NATIVE_PAPER_REPLAY_ONLY; DEVICE_VERIFIED=false; LIVE_BROKER_VERIFIED=false'
