name: ARTITRADE 0.0.17 stock preload and pending regression
on:
  push:
    branches: [artitrade-017-preload-count-and-stock-pending-20261119]
    paths:
      - ARTITRADE_ANDROID/app/src/main/**
      - ARTITRADE_ANDROID/app/build.gradle
      - ARTITRADE_ANDROID/ui_tests/test_v016_global_position_uid_and_cfg_single.py
      - ARTITRADE_ANDROID/ui_tests/test_v016_preload_trend_ledger.py
      - ARTITRADE_ANDROID/ui_tests/test_v017_stock_preload_progress.py
      - ARTITRADE_ANDROID/ui_tests/test_v081_both_feed_preload.py
      - ARTITRADE_ANDROID/ui_tests/test_v016_position_uid_cfg_single.py
      - docs/artitrade/**
      - AGENTS.md
      - .github/workflows/artitrade-016-preload-trend-ledger-regression.yml
  pull_request:
    branches: [artitrade-016-preload-trend-ledger-20261119]
    paths:
      - ARTITRADE_ANDROID/app/src/main/**
      - ARTITRADE_ANDROID/ui_tests/**
      - .github/workflows/artitrade-017-stock-preload-regression.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verified original legacy trading source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests==2.32.5 websockets==15.0.1 holidays
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile,ast
          base=Path("ARTITRADE_ANDROID/app/src/main/assets/strategy_v070")
          raw=base64.b64decode("".join((base/f"part_{i:02d}.txt").read_text("ascii") for i in range(22)))
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=="b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb",sha
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith(".py"):ast.parse(z.read(name).decode("utf8"),filename=name)
              z.extractall("/tmp/artitrade-015-original")
          print("ORIGINAL_82_MODULES_VERIFIED")
          PY
      - name: Inspect bundled original stock pending and parent history guard sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ORIGINAL_NATIVE_PARENT_GAP_TRACE ==='
          grep -R -n -C 12 -E 'FIX14_LIVE_HIGHER_FRAME_GAP_GUARDED|LIVE_PARENT_GAP|FIX13_LIVE_PENDING_GAP_HOLD|FIX5_FRAME_UNVERIFIED' /tmp/artitrade-015-original/ --include='*.py' | head -n 240 || true
      - name: Verified original candle/book preload and trend wallet BUY/PnL tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-015-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v015_global_position_uid_and_cfg_single.py' -v 2>&1 | tee /tmp/artitrade-v016-tests.log
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v015_position_uid_cfg_single.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v016_preload_trend_ledger.py' -v 2>&1 | tee -a /tmp/artitrade-v016-tests.log
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v017_stock_preload_progress.py' -v 2>&1 | tee -a /tmp/artitrade-v016-tests.log
      - name: Eight unchanged native PAPER strategy wallets and related root guards
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-015-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          for suite in test_v002_eight_virtual_paper_end_to_end.py test_v014_cfg_native_sell_quote_regression.py test_v012_legacy_purge_and_holding_frame.py test_v002_ledger_rollback_guard.py test_v013_stock_at_pending_to_native_buy.py test_v004_abnormal_reconnect_six.py test_v092_scenarios_8_wallets.py test_v089_fast_prices_rotation.py test_v081_both_feed_preload.py test_v006_trend_5m_retirement_and_startup.py; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$suite" -v 2>&1 | tee -a /tmp/artitrade-v016-tests.log
          done
      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/artitrade/build_source_graph.py --output artitrade_source_graph.json
          python3 tools/artitrade/validate_dependency_contracts.py --generated artitrade_source_graph.json
      - name: Publish sanitized failing native-test reasons to issue 104
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "0.0.17 synthetic-only CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Fixtures only, no user device data or live trading.'
            echo '~~~'
            tail -n 110 /tmp/artitrade-v016-tests.log 2>/dev/null | sed -E 's#/home/runner/work/[^ ]+#<CI_WORKSPACE>#g' || true
            echo '~~~'
          } > /tmp/artitrade-v016-error.md
          gh issue comment 104 --repo "$GITHUB_REPOSITORY" --body-file /tmp/artitrade-v016-error.md
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile exact Android UI and ledger guard, no signed APK
        run: |
          set -euo pipefail
          gradle -p ARTITRADE_ANDROID :app:compileUnifiedDebugJavaWithJavac --no-daemon --stacktrace 2>&1 | tee /tmp/artitrade-v016-gradle.log
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
      - name: Publish sanitized Java compile error trace
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '0.0.16 Android Java compile failure diagnostic (synthetic CI only)'
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '~~~'
            grep -n -E -C 9 '(error:|FAILURE:|What went wrong:|Caused by:|> Could not|Execution failed for task|Compilation failed|ANDROID_HOME|SDK location|No toolchains|Unable to create)' /tmp/artitrade-v016-gradle.log 2>/dev/null | head -n 115 | sed -E 's#/home/runner/work/[^ ]+#<CI_WORKSPACE>#g' || true
            echo '~~~'
          } > /tmp/artitrade-v016-gradle-errors.md
          gh issue comment 104 --repo "$GITHUB_REPOSITORY" --body-file /tmp/artitrade-v016-gradle-errors.md
