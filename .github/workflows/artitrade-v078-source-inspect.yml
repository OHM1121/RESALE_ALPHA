name: ARTITRADE v078 source inspection
on:
  push:
    paths:
      - '.github/workflows/artitrade-v078-source-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original Upbit websocket and minute history source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,re
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          z=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(22)))
          assert hashlib.sha256(z).hexdigest()=='e7518cb90a73cf62522aaa8962d872890e9e517ae988f52c22b3d94ed88531e0'
          with zipfile.ZipFile(io.BytesIO(z)) as f:
              for fname in ['d_upbit.py','d_live.py','d_minute_repair_fast.py']:
                  src=f.read(fname).decode()
                  lines=src.splitlines()
                  print('===========',fname,'LINES',len(lines),'===========')
                  matched=[]
                  for i,line in enumerate(lines):
                      if re.search(r'is_only_realtime|ticker|trade_price|trade_timestamp|last_book|latest_prices|_both_watched_codes|minute_client|candles\(|history_bars|class Upbit|class Coin|_new_tick|websocket|on_message',line,re.I):
                          matched.append(i)
                  for i in matched[:85]:
                      print(f'LINE {i+1} '+line[:280])
                      if re.search(r'is_only_realtime|latest_prices\[|ticker.*message|\bcandles\(',line,re.I):
                          for j in range(max(0,i-4),min(len(lines),i+7)):
                              print(f'CTX {j+1} '+lines[j][:240])
          PY
