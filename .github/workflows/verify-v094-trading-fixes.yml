name: ARTITRADE v094 2-tick partial entry, forced sell and MA legacy tests
on:
  push:
    branches: [fix-artitrade-v094-forced-exits-ma-legacy-partial-chase-20261117]
    paths:
      - '.github/workflows/verify-v094-trading-fixes.yml'
      - 'ARTITRADE_ANDROID/ui_tests/test_v094_*.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/partial_entry_v094.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_manual_paper_sell_v085.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v067_stock_runtime.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v067_coin_runtime.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/legacy_ma_exit_watch_v094.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/coin_partial_entry_v094.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/market_trend_wallet_v054.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore original stock and coin engine modules
        run: |
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          b=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            assert z.testzip() is None and len(z.namelist())==82
            z.extractall('/tmp/artitrade-v094-original')
          PY
      - name: User-defined true +2 tick and per-symbol funding remaining
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v094-original" python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_*.py' -v
      - name: v091 true PAPER 1-2-3 exits unchanged
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v094-original" python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_ma_three_stage_real_ledger.py' -v
