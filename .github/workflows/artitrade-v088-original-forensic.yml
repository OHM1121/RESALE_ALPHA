name: ARTITRADE v088 inspect original MA KeyError high call paths
on:
  push:
    branches: [ fix-artitrade-v088-log-forensics-export-ma-20261117 ]
    paths: [ '.github/workflows/artitrade-v088-original-forensic.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Enumerate all indexed high accesses reachable from original coin MA book
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,ast
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          blob=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              s=z.read('d_upbit.py').decode()
              tree=ast.parse(s)
              lines=s.splitlines()
              for n in ast.walk(tree):
                  if not isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                  keys=[x.lineno for x in ast.walk(n) if isinstance(x,ast.Subscript) and isinstance(x.slice,ast.Constant) and x.slice.value=='high']
                  if keys:
                      print('HIGH_ACCESS_METHOD',n.name,n.lineno,keys[:10])
                      for line in keys[:6]:print('HIGH_ACCESS_LINE',line,lines[line-1].strip()[:180])
              fn=next(n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and n.name=='process_book')
              for call in ast.walk(fn):
                  if isinstance(call,ast.Call) and isinstance(call.func,ast.Attribute):
                      if isinstance(call.func.value,ast.Name) and call.func.value.id in ('self','sr'):
                          print('BOOK_CALL',call.lineno,call.func.value.id,call.func.attr)
          PY