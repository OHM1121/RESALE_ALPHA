name: ARTITRADE v088 trace original MA book high KeyError hooks
on:
  push:
    branches: [ fix-artitrade-v088-log-forensics-export-ma-20261117 ]
    paths: [ '.github/workflows/artitrade-v088-original-forensic.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Trace every patched MA orderbook hook and high usage
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,ast,re
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          b=base64.b64decode(''.join((root/('part_%02d.txt'%i)).read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              for name in z.namelist():
                  if not name.endswith('.py'):continue
                  s=z.read(name).decode('utf8')
                  x=s.splitlines()
                  if ('process_book=' in s or 'process_book =' in s or 'MA_BOOK_PROCESS_FAIL' in s):
                      for i,line in enumerate(x):
                          if ('process_book=' in line or 'process_book =' in line) and ('MA' in line or 'ma' in line or 'CoinPaperLedger' in line):
                              print('HOOK',name,i+1,line[:200])
                  if name=='d_upbit.py':
                      tree=ast.parse(s)
                      methods=[n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and
                               n.name in ('process_book','_observe_prebuy_path','_fill_orders','_risk_bid_levels','_dispatch_public_book')]
                      for method in methods:
                          print('ORIGINAL_METHOD',name,method.name,method.lineno)
                          for sub in ast.walk(method):
                              if isinstance(sub,ast.Subscript) and isinstance(sub.slice,ast.Constant) and sub.slice.value=='high':
                                  print('BOOK_HIGH_ACCESS',method.name,sub.lineno,
                                        ' '.join(x[max(0,sub.lineno-4):sub.lineno+3]))
                  if 'MACoinLedger.process_book' in s and name!='d_upbit.py':
                      print('MA_HOOK_FILE',name)
                      for i,line in enumerate(x):
                          if 'process_book' in line and ('ma' in line.lower() or 'ledger' in line.lower()):
                              print('MA_HOOK_LINE',i+1,line.strip()[:250])
          PY