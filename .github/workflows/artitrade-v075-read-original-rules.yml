name: ARTITRADE v075 frozen GMO / CW rule and exception trace
on:
  push:
    branches: [fix-artitrade-v075-gmo-cw-audit-20261116]
    paths: ['.github/workflows/artitrade-v075-read-original-rules.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original Python engine with line numbers read only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,zipfile,ast,re
          a=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          blob=base64.b64decode(''.join((a/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
            names=z.namelist()
            print('=== MODULES_OF_INTEREST ===')
            print('\n'.join(s for s in names if re.search(r'gmo|close|cw|score|flow',s,re.I)))
            for name in names:
              if not (name in ('d_gmo_runtime.py','projectgmo/engine.py','d_close_runtime.py','d_close.py','d_live.py','d_cw.py') or re.search('projectgmo/.+\.py',name)):
                continue
              src=z.read(name).decode('utf8');lines=src.splitlines()
              print('=== FILE',name,'LINE_COUNT',len(lines),'===')
              try:tree=ast.parse(src)
              except SyntaxError as exc:print('AST_ERROR',exc);continue
              for node in ast.walk(tree):
                if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                print('METHOD',node.name,node.lineno,node.end_lineno)
              if name=='d_gmo_runtime.py':
                spans=[(1,220),(220,440),(440,690),(690,930),(930,1100)]
              elif name=='projectgmo/engine.py':
                spans=[(1,250),(250,490)]
              elif name=='d_live.py':
                spans=[(500,660)]
              else:
                spans=[]
              for start,stop in spans:
                print('=== SPAN',name,start,stop,'===')
                for i in range(start,min(stop,len(lines))+1):
                  print('LINE',i,lines[i-1][:230])
          PY
