name: ARTITRADE v0.7.47 Entry Candle Close Trend Cohort Validation
on:
  push:
    branches:
      - feature-artitrade-v047-entry-context-trend-cohort-20261115
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v047-entry-context-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate v047 entry contexts and complete historical regression
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v047_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v046_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v045_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v044_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v043_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v042_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v041_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v040_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v039_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v038_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v037_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v036_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v035_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v031_*.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v028_trade_record_parity.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v030_*.py' -v
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          javac -d /tmp/artitrade-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SignedMarketScore.java ARTITRADE_ANDROID/ui_tests/SignedMarketScoreTest.java
          java -cp /tmp/artitrade-jvm com.artitrade.mobile.SignedMarketScoreTest
          javac -d /tmp/artitrade-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistorySelection.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchScoreGrid.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ResearchBandSelection.java ARTITRADE_ANDROID/ui_tests/ResearchBandSelectionTest.java ARTITRADE_ANDROID/ui_tests/ResearchScoreGridTest.java
          java -cp /tmp/artitrade-jvm com.artitrade.mobile.ResearchBandSelectionTest
          java -cp /tmp/artitrade-jvm com.artitrade.mobile.ResearchScoreGridTest
          javac -d /tmp/artitrade-jvm ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/ColumnQueryV036.java ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStatusV036.java ARTITRADE_ANDROID/ui_tests/ColumnQueryV036Test.java ARTITRADE_ANDROID/ui_tests/SyncStatusV036Test.java
          java -cp /tmp/artitrade-jvm com.artitrade.mobile.ColumnQueryV036Test
          java -cp /tmp/artitrade-jvm com.artitrade.mobile.SyncStatusV036Test
      - name: Compile v047 APK with nonrelease CI-local key
        working-directory: ARTITRADE_ANDROID
        env:
          CI: 'false'
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Check v047 compiled package - DO NOT distribute this test key
        run: |
          APK="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.artitrade.unified.s21dex' versionCode='54'"
          echo "TEST-KEY ONLY. Build is not eligible for in-place user update."
