name: V087 rotation, CLOSE, feed pressure and staged exit tests
on:
  push:
    branches: [fix-artitrade-v087-orientation-cw-rsi-feed-catchup-20261118]
    paths:
      - .github/workflows/verify-v087-five-issues.yml
      - ARTITRADE_ANDROID/app/src/main/AndroidManifest.xml
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
      - ARTITRADE_ANDROID/app/src/main/python/stock_quote_truth_v066.py
      - ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
      - ARTITRADE_ANDROID/ui_tests/test_v087_rotation_cw_quote_recovery.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Preserve exact original EXE strategy source and load original tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile,ast
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            assert z.testzip() is None and len(z.namelist())==82
            for name in ('at_close_runner.py','at_close_engine.py','d_live.py','d_upbit.py'):
              ast.parse(z.read(name).decode())
            z.extractall('/tmp/v087-original-exe-core')
          PY
      - name: Test all non-destructive UI and original exit invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/v087-original-exe-core:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v087_rotation_cw_quote_recovery.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_at_native_catchup.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_live_quotes_stages_export.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v093_strategy_subscription_priority.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v085_exit_pnl_parity.py' -v
