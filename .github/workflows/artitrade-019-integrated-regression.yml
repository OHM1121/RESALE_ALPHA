name: ARTITRADE 0.0.19 source and Android integration regression (NO APK)
on:
  push:
    branches: [artitrade-019-eight-wallet-target-plan-display-20261119]
    paths:
      - ARTITRADE_ANDROID/app/src/main/python/staged_exit_preview_v019.py
      - ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
      - ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
      - ARTITRADE_ANDROID/ui_tests/test_v019_native_exit_plan_readonly.py
      - .github/workflows/artitrade-019-integrated-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eight-owner-native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unpack unchanged original source 82 modules for real regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          data=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          assert hashlib.sha256(data).hexdigest()=='b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/artitrade-019-original')
          PY
      - name: Install original strategy runtime test dependencies
        run: python3 -m pip install -q requests websockets holidays
      - name: Compile all source before native regression
        run: python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
      - name: Core 0.0.19 preview plus original eight-wallet regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-019-original:$PWD/ARTITRADE_ANDROID/ui_tests"
          for suite in \
            test_v019_native_exit_plan_readonly.py \
            test_v002_eight_virtual_paper_end_to_end.py \
            test_v011_new_legacy_resting_and_legacy_retirement.py \
            test_v012_legacy_purge_and_holding_frame.py \
            test_v014_cfg_native_sell_quote_regression.py \
            test_v015_global_position_uid_and_cfg_single.py \
            test_v016_preload_trend_ledger.py \
            test_v017_native_pending_retry.py \
            test_v018_rev1_low_close_and_fast_ma.py \
            test_v097_gmo_preplan.py \
            test_v075_gmo_cw_original_failure_audit.py \
            test_v092_scenarios_8_wallets.py \
            test_v108_native_ma_trend_entry_paths.py \
            test_v107_at_negative_market_gate.py \
            test_v006_trend_5m_retirement_and_startup.py \
            test_v002_ledger_rollback_guard.py; do
            echo "TEST $suite"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$suite" -v
          done
      - name: Validate existing dependency governance
        shell: bash
        run: |
          python3 tools/artitrade/build_source_graph.py --output artitrade_source_graph.json
          python3 tools/artitrade/validate_dependency_contracts.py --generated artitrade_source_graph.json
  java-compile-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compile 0.0.19 UI source without packaging or signing
        run: |
          set -euo pipefail
          gradle -p ARTITRADE_ANDROID :app:compileUnifiedDebugJavaWithJavac --no-daemon --stacktrace
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
