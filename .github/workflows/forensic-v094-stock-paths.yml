name: ARTITRADE v094 read-only stock sell-and-buy source trace
on:
  push:
    branches: [fix-artitrade-v094-forced-exits-ma-legacy-partial-chase-20261117]
    paths: ['.github/workflows/forensic-v094-stock-paths.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Stock native exact selling, buying, forced and matching methods
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          a=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          b=base64.b64decode(''.join((a/f'part_{i:02d}.txt').read_text() for i in range(22)))
          spans={
            'stock_ma_engine.py':[(16,36),(205,330)],
            'd_v19_portfolio.py':[(145,214),(1073,1265),(1265,1369),(1380,1555)],
            'at_close_runner.py':[(371,449)],
            'd_live.py':[(906,968)],
            'android_live_bridge.py':[(78,185)]}
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            for name,rr in spans.items():
              print('===== FILE',name,'=====')
              lines=z.read(name).decode().splitlines()
              for lo,hi in rr:
                print('----- RANGE',lo,hi,'-----')
                for i in range(lo-1,min(hi,len(lines))):
                  print('S',name,i+1,lines[i][:350])
          PY
