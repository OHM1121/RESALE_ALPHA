name: ARTITRADE 0.0.2 signed Samsung APK release
on:
  push:
    branches: [artitrade-phone-main-v070-live-orders-20261112]
    paths:
      - .github/workflows/artitrade-002-original-key-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artitrade-002-only-signed-release
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      ARTIFACT: ARTITRADE_0.0.2
      TAG: ARTITRADE-0.0.2
      SOURCE: '57eb7e9acf9ebc78c8eddfb93e2ee87e5598bfd6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '57eb7e9acf9ebc78c8eddfb93e2ee87e5598bfd6'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require exact previously installed signer
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Verify signing identity before any compilation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.cache-hit }}" = "true"
          test -s "$HOME/.android/debug.keystore"
          fp="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "COMPUTED_SIGNER_SHA256=$fp"
          test "$fp" = "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6"
      - name: Preserve v0.9.5 vendor-quote fixes without changing 0.0.2 UI or identity
        shell: bash
        run: |
          set -euo pipefail
          # The prior verified patch scripts expect old source Gradle metadata.
          # Apply them on THIS ephemeral checkout only; restore 0.0.2 afterward.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ARTITRADE_ANDROID/app/build.gradle")
          s=p.read_text("utf8")
          assert s.count("versionCode 124")==1
          assert s.count("versionName '0.0.2'")==1
          assert s.count("applicationId 'com.artitrade.unified.s21dex'")==1
          s=s.replace("versionCode 124","versionCode 97").replace(
              "versionName '0.0.2'","versionName '0.7.91-MA-STAGE-LEDGER'")
          p.write_text(s,"utf8")
          PY
          python3 ARTITRADE_ANDROID/ui_tests/patch_v092_realtime_ws_latency.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v093_strategy_priority_metadata.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v105_ka10004_readonly.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ARTITRADE_ANDROID/app/build.gradle")
          s=p.read_text("utf8")
          assert s.count("versionCode 99")==1
          assert s.count("versionName '0.7.93-STOCK-SUBSCRIPTION-PRIORITY'")==1
          s=s.replace("versionCode 99","versionCode 124").replace(
              "versionName '0.7.93-STOCK-SUBSCRIPTION-PRIORITY'","versionName '0.0.2'")
          assert s.count("versionCode 124")==1 and s.count("versionName '0.0.2'")==1
          p.write_text(s,"utf8")
          PY
      - name: Source compilation and original embedded strategy SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 - <<'PY'
          import ast,base64,hashlib,io,zipfile
          from pathlib import Path
          main=Path('ARTITRADE_ANDROID/app/src/main')
          original=main/'assets/strategy_v070'
          data=base64.b64decode(''.join((original/('part_%02d.txt'%i)).read_text('ascii') for i in range(22)))
          sha=hashlib.sha256(data).hexdigest()
          bridge=(main/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text('utf8')
          assert 'CORE_SHA256="'+sha+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              live=z.read('d_live.py').decode('utf8')
              coin=z.read('d_upbit.py').decode('utf8')
              assert "('ka10004','/api/dostk/mrkcond')" in live
              assert 'async def _v092_read_login_ack(' in live
              assert "depth_codes=sorted(code+'.15'" in coin
              for name in z.namelist():
                  if name.endswith('.py'):ast.parse(z.read(name).decode('utf8'),filename=name)
              z.extractall('/tmp/artitrade-002-native')
          print('EXACT_VENDOR_CORE_AND_VENDOR_QUOTE_PATCHES_PASS',sha)
          PY
      - name: Complete source-only eight-strategy, ledger, quote and UI regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-002-native:$PWD/ARTITRADE_ANDROID/ui_tests"
          for pattern in \
            test_new_legacy_1118_workbook.py \
            test_v002_ledger_rollback_guard.py \
            test_v003_daily_market_backup.py \
            test_v004_clean_ledger_empty_ui.py \
            test_v001_fresh_performance_version.py \
            test_v102_plain_version_label.py \
            test_v104_ui_json_oom_root_cause.py \
            test_v106_fresh_paper_epoch.py \
            test_v108_mandatory_first_epoch.py \
            test_v108_native_ma_trend_entry_paths.py \
            test_v107_at_negative_market_gate.py \
            test_v107_closed_rsi_and_exports.py \
            test_v107_entry_plan_epoch.py \
            test_v092_scenarios_8_wallets.py \
            test_v086_stock_manual_all.py \
            test_v088_error_exports_and_source_integrity.py \
            test_v088_export_zip_full_500mb_coin_monotonic.py \
            test_v090_rotation_lock_zip_restore.py \
            test_v082_error_export_cancellation.py \
            test_v100_manual_denial_and_targets.py \
            test_v100_d19_native_manual_exit.py \
            test_v091_d19_original_at_reconnect_and_portrait.py \
            test_v096_manual_result_lifecycle.py \
            test_v105_manual_rest_bid.py \
            test_v101_zip95_analysis_ready.py; do
            echo "TESTING $pattern"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pattern" -v
          done
      - name: Build arm64 unified Android package with exact existing signer
        working-directory: ARTITRADE_ANDROID
        shell: bash
        run: gradle --no-daemon :app:assembleUnifiedDebug :app:assembleHubDebug --stacktrace
      - name: Verify APK package, strict numeric version and unchanged certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk
          test -s "$apk"
          pkg="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package: ')"
          case "$pkg" in
            *"name='com.artitrade.unified.s21dex' versionCode='124' versionName='0.0.2'"*) ;;
            *) echo "INVALID_APK_PACKAGE_OR_NUMERIC_VERSION: $pkg" >&2; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /tmp/artitrade_001_signer.txt
          grep -iF '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/artitrade_001_signer.txt
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/'
          cp "$apk" "$ARTIFACT.apk"
          sha256sum "$ARTIFACT.apk" > "$ARTIFACT.sha256"
          printf 'versionName=0.0.2\nversionCode=124\npackage=com.artitrade.unified.s21dex\nsource=%s\nold_paper_reset=ALREADY_COMMITTED_PRESERVE\nworkbook_policy=NEW_LEGACY_11.18\nactual_samsung_fills_verified=false\n' "$SOURCE" > "$ARTIFACT.txt"
          hub=ARTITRADE_ANDROID/app/build/outputs/apk/hub/debug/app-hub-debug.apk
          test -s "$hub"
          hub_pkg="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$hub" | grep '^package: ')"
          case "$hub_pkg" in
            *"name='com.artitrade.hub.s21dex' versionCode='27' versionName='0.0.2'"*) ;;
            *) echo "INVALID_MSERVER_PACKAGE_OR_VERSION: $hub_pkg" >&2; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$hub" > /tmp/artitrade_002_hub_signer.txt
          grep -iF '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/artitrade_002_hub_signer.txt
          cp "$hub" "ARTITRADE_MSERVER_0.0.2.apk"
          sha256sum ARTITRADE_MSERVER_0.0.2.apk > ARTITRADE_MSERVER_0.0.2.sha256
      - name: Upload verified APK as GitHub Actions download
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_0_0_2_ORIGINAL_SIGNED_APK
          path: |
            ARTITRADE_0.0.2.apk
            ARTITRADE_0.0.2.sha256
            ARTITRADE_0.0.2.txt
            ARTITRADE_MSERVER_0.0.2.apk
            ARTITRADE_MSERVER_0.0.2.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish 0.0.2 signed APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c "$ARTIFACT.sha256"
          cat > /tmp/ARTITRADE_002_release_notes.md <<'NOTES'
          ARTITRADE 0.0.2
          - Based on NEW LEGACY(11.18).xlsx, preserving all 0.0.1 accumulated PAPER balances, fills and histories. No second epoch wipe.
          - Reference-bar score strictly positive at BUY, new original-range stop, staged original 30%/35%/remainder targets with frame-based exits.
          - MA new upward-turn entries only; retired bearish-candle new BUY; per-frame 30%/35% targets, -15% stop and hold period.
          - MarketTrend 30m/60m/day RSI20<=30 first observation with 24-hour persistent watch, actual Bollinger 20/1.5 middle touch when slope angle in (-20,+30), top-50 universe; 30%/35% and new frame hold/stop.
          - Original CW and GMO criteria unchanged. Original exchange quotes, PAPER execution journal, cash and position limits unchanged.
          - SELL target order intents in PAPER are persisted plans, NOT live exchange resting orders. Actual PAPER fills require fresh market depth/proof.
          - Independent monotonic ledger high-water witness and no older PC books automatically refilled into current phone ledger.
          - Daily original WAL-safe MSERVER backup: stock valid KRX session days 20:10 KST, coin daily 11:30 KST, 90s stable reboot catchup. Encrypted chunked verified hub backup, read-only recovery download.
          - Includes MSERVER 0.0.2 companion APK (update separately; backup APIs require both).
          - GitHub regression/source/Android sign validation only; physical Samsung purchase/sale and paired MSERVER were not verified.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists, refusing accidental replacement"; exit 1
          fi
          sha256sum -c ARTITRADE_MSERVER_0.0.2.sha256
          gh release create "$TAG" "$ARTIFACT.apk" "$ARTIFACT.sha256" "$ARTIFACT.txt" \
            "ARTITRADE_MSERVER_0.0.2.apk" "ARTITRADE_MSERVER_0.0.2.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE" \
            --title "ARTITRADE 0.0.2" \
            --notes-file /tmp/ARTITRADE_002_release_notes.md --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets --jq '{tagName:.tagName,assets:[.assets[].name]}'
