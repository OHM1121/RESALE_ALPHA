name: ARTITRADE 0.0.8 original GMO clock contract READ ONLY
on:
  push:
    branches: [fix-artitrade-008-specialsession-trend-proof-20261119]
    paths:
      - .github/workflows/artitrade-v008-native-gmo-time-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect packaged native trading clock and D+1 order ownership without executing it
        run: |
          python3 - <<'PY'
          import ast,base64,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          data=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              files=[x for x in archive.namelist() if x.endswith('.py')]
              print('ORIGINAL_FILES_OF_INTEREST',[x for x in files if 'gmo' in x.lower() or 'live' in x.lower() or 'calendar' in x.lower()])
              for name in files:
                  if name not in ('d_live.py','d_gmo_runtime.py','projectgmo/engine.py'):
                      continue
                  src=archive.read(name).decode('utf8')
                  tree=ast.parse(src)
                  lines=src.splitlines()
                  print('MODULE',name,'LENGTH',len(lines))
                  for node in ast.walk(tree):
                      if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                      if node.name in ('live_session','calendar_status','_d1_buy_window_ok','on_live_tick','on_priority_tick','_next_day','open_entry','_session_active','on_tick','start','_patch_gmo'):
                          snippet='\n'.join(lines[node.lineno-1:min(node.end_lineno,node.lineno+115)])
                          print('FUNCTION',name,node.name,node.lineno,'\n',snippet)
                  for i,line in enumerate(lines):
                      if '2026-11-19' in line or 'SPECIAL_SESSIONS' in line or '09:00' in line or '10:00' in line or '08:50' in line or '1530' in line or '0900' in line or 'session_clock' in line:
                          print('CLOCK_MATCH',name,i+1,line[:220])
          PY
