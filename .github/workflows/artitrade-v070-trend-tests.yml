name: ARTITRADE v070 coin trend WebSocket-only signal provenance regression
on:
  push:
    branches: [ fix-artitrade-v070-coin-trend-ws-provenance-20261116 ]
    paths:
      - 'ARTITRADE_ANDROID/app/src/main/python/market_trend_runtime_v043.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v069_coin_trend_tick_freshness.py'
      - '.github/workflows/artitrade-v070-trend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract exact v068 original strategy core without modifying it
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((p/('part_%02d.txt'%i)).read_text() for i in range(22)))
          j=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert ('CORE_SHA256="'+hashlib.sha256(raw).hexdigest()+'"') in j
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              z.extractall('/tmp/artitrade-v069-verified-core')
          print('SOURCE_BUNDLE_IMMUTABLE',hashlib.sha256(raw).hexdigest())
          PY
      - name: Verify live order book remains 3-second fresh and no synthetic tick
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          x=Path('ARTITRADE_ANDROID/app/src/main/python/market_trend_runtime_v043.py').read_text()
          assert "COIN_VERIFIED_TRADE_MAX_AGE_SEC=10.0" in x
          assert "if abs(time.time()-float(book.get(\"timestamp\",0))/1000)>3:return None" in x
          assert 'return {"trade":price,"ask":ask,"bid":bid,"ask_size":size,"bid_size":bid_size}' in x
          assert 'recent_entry_blocks' in x
          assert '_PRICE_OBSERVATION_CONTEXT.rest_only=True' in x
          assert 'd_upbit.UpbitPaperRunner._rest_quotes=mark_only_rest_quotes' in x
          PY
      - name: Compile and test trend, MA, legacy, wallet and clock contracts
        env:
          PYTHONPATH: '/tmp/artitrade-v069-verified-core:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -e
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          for pat in 'test_v069_*.py' 'test_v067_*.py' 'test_v066_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -v
          done
          git diff --check
