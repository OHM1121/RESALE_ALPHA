name: ARTITRADE v087 MA Sell + memory fix entire strategy regression
on:
  push:
    branches: [ fix-artitrade-v087-crash-guard-ma-sell-price-20261117 ]
    paths: [ '.github/workflows/artitrade-v087-verify.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate exact bundled original source and live-broker safety
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile,io,ast
          p=Path('ARTITRADE_ANDROID/app/src/main')
          src=base64.b64decode(''.join((p/'assets/strategy_v070'/f'part_{i:02d}.txt').read_text()
                                   for i in range(22)))
          bridge=(p/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert 'CORE_SHA256="'+hashlib.sha256(src).hexdigest()+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(src)) as z:
              assert len(z.namelist())==82 and z.testzip() is None
              for n in z.namelist():
                  if n.endswith('.py'):ast.parse(z.read(n).decode())
              z.extractall('/tmp/artitrade-v087-core')
          gradle=Path('ARTITRADE_ANDROID/app/build.gradle').read_text()
          assert "versionCode 93" in gradle
          assert "versionName '0.7.87-STABILITY-MA-SELL-PRICE'" in gradle
          assert "applicationId 'com.artitrade.unified.s21dex'" in gradle
          print('V087 PINNED_82_MODULE_EXE_AND_ORIGINAL_DATA_SAFETY_PASS')
          PY
      - name: Run all newly fixed v087, v086 and v085 trading and integrity tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          export PYTHONPATH="$(pwd)/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v087-core"
          for pat in 'test_v087_*.py' 'test_v086_*.py' 'test_v085_*.py'; do
            echo "MANDATORY $pat"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -q
          done
      - name: Test real Java Korean price formatting, not just Python logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/artitrade-v087-java
          cat > /tmp/PriceV087.java <<'JAVA'
          package com.artitrade.mobile;
          public class PriceV087 {
            public static void main(String[] a) {
              if(!WonFormat.price(8.2).equals("8.20원"))throw new RuntimeException("SNT display: "+WonFormat.price(8.2));
              if(!WonFormat.price(8.364).equals("8.36원"))throw new RuntimeException("target display");
              if(!WonFormat.price(9400).equals("9,400원"))throw new RuntimeException("integer price");
              if(!WonFormat.won(8.2).equals("8원"))throw new RuntimeException("P&L changed");
              System.out.println("V087_JAVA_DECIMAL_PRICE_8_20_AND_CASH_TOTAL_SEPARATION_PASS");
            }
          }
          JAVA
          javac -encoding UTF-8 -d /tmp/artitrade-v087-java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/WonFormat.java /tmp/PriceV087.java
          java -cp /tmp/artitrade-v087-java com.artitrade.mobile.PriceV087
      - name: Run all 30 historical strategy and ledger regression groups
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$(pwd)/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v087-core"
          failed=0
          for pat in 'test_v082_*.py' 'test_v081_*.py' 'test_v080_*.py' 'test_v079_*.py' 'test_v077_*.py' 'test_v076_*.py' 'test_android_ledger_backup.py' 'test_v075_*.py' 'test_v074_*.py' 'test_v073_*.py' 'test_v072_*.py' 'test_v071_*.py' 'test_v069_*.py' 'test_v068_*.py' 'test_v067_*.py' 'test_v066_*.py' 'test_v064_*.py' 'test_v063_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v053_*.py' 'test_v051_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
             echo "HISTORICAL $pat"
             python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -q || failed=1
          done
          exit "$failed"
