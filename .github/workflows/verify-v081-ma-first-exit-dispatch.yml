name: Verify v0.8.1 MA legacy TP1 dispatcher
on:
  push:
    branches:
      - fix-artitrade-v081-ma-legacy-first-sell-dispatch-20261117
    paths:
      - '.github/workflows/verify-v081-ma-first-exit-dispatch.yml'
      - 'ARTITRADE_ANDROID/app/src/main/python/legacy_ma_exit_watch_v094.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v094_legacy_ma_exit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ma-dispatch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original runtime prerequisites and extract pinned core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          parts=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          original=base64.b64decode(''.join((parts/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(original)) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist())==82
              archive.extractall('/tmp/artitrade-v081-core')
          PY
      - name: Regression original historical MA BUY wallets and v067 1-2-3 exits
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v081-core"
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python/legacy_ma_exit_watch_v094.py ARTITRADE_ANDROID/ui_tests/test_v094_legacy_ma_exit.py
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_legacy_ma_exit.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_ma_three_stage_real_ledger.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v089_verified_exits_ma.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v093_strategy_subscription_priority.py' -v
