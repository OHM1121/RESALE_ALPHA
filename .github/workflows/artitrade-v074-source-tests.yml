name: ARTITRADE v074 offline critical-path regression
on:
  push:
    branches: [fix-artitrade-v074-ma-trend-forensic-20261116]
    paths: ['.github/workflows/artitrade-v074-source-tests.yml']
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify pinned core and extract for read-only tests
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          a=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          z=base64.b64decode(''.join((a/('part_%02d.txt'%i)).read_text() for i in range(22)))
          sha=hashlib.sha256(z).hexdigest()
          bridge=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert 'CORE_SHA256="'+sha+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(z)) as f:
            assert len(f.namelist())==82
            f.extractall('/tmp/artitrade-v074-original')
            core=f.read('d_upbit.py').decode()
            for key in ('def _both_watched_codes','def _ws(','def _ma_scan_decision'):
              idx=core.find(key)
              print('SOURCE_UPBIT_ENTRY',key,'FOUND',idx>=0)
              if idx>=0:print(core[idx:idx+1300])
          print('SIGNED_BASE_CORE_SHA256',sha)
          PY
      - name: Compile and run all relevant trade/system regressions
        env:
          PYTHONPATH: /tmp/artitrade-v074-original:ARTITRADE_ANDROID/app/src/main/python
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          for pat in 'test_v074_*.py' 'test_v073_*.py' 'test_v072_*.py' 'test_v071_*.py' 'test_v069_*.py' 'test_v067_*.py' 'test_v066_*.py' 'test_v064_*.py' 'test_v063_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v054_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -v
          done
          echo 'PASS_V074_NO_ORDER_RESEARCH_AND_STALE_BOOK_BROKER_GATES'
