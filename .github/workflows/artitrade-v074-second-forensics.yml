name: ARTITRADE v074 1-second historical trade-candle forensic (READ ONLY)
on:
  push:
    branches: [fix-artitrade-v074-ma-trend-forensic-20261116]
    paths: ['.github/workflows/artitrade-v074-second-forensics.yml']
permissions: {contents: read}
jobs:
  quote-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query Upbit PUBLIC 1-second candles, not private orders or keys
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,sys,datetime as dt
          sys.path.insert(0,'ARTITRADE_ANDROID/app/src/main/python')
          import market_trend_v043 as mt
          import ma_v067_policy as ma
          def fetch(path,**args):
            url='https://api.upbit.com/v1/candles/'+path+'?'+urllib.parse.urlencode(args)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ARTITRADE-PUBLIC-FORENSIC/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                print('HTTP',r.status,'Remaining-Req',r.headers.get('Remaining-Req'),'for',args.get('market'),path)
                return sorted(json.load(r),key=lambda x:x['candle_date_time_kst'])
            except Exception as exc:
              print('NOT_AVAILABLE',path,args.get('market'),type(exc).__name__,str(exc)[:180])
              return []
          for name,target,candle_end,minute,minute_to in (
             ('KRW-DRV','2026-11-16T10:49:','2026-11-16T01:50:00Z',5,'2026-11-16T01:50:00Z'),
             ('KRW-SKR','2026-11-16T09:59:','2026-11-16T01:00:00Z',60,'2026-11-16T01:00:00Z')):
             print('===',name,target,'===')
             seconds=fetch('seconds',market=name,to=candle_end,count=200)
             bars=fetch('minutes/'+str(minute),market=name,to=minute_to,count=200)
             barstart='2026-11-16T10:45:00' if name=='KRW-DRV' else '2026-11-16T09:00:00'
             previous=[float(x['trade_price']) for x in bars if x['candle_date_time_kst']<barstart]
             selected=[x for x in seconds if x['candle_date_time_kst'].startswith(target)]
             print('SECOND_CANDLES_NEAR_DEADLINE',[(x['candle_date_time_kst'],x['trade_price']) for x in selected])
             if name=='KRW-DRV':
               for sec in (45,48):
                 cutoff=target+('%02d'%sec)
                 eligible=[x for x in seconds if x['candle_date_time_kst']<=cutoff]
                 row=eligible[-1] if eligible else None
                 if row:
                   age=(dt.datetime.fromisoformat(cutoff)-dt.datetime.fromisoformat(row['candle_date_time_kst'])).total_seconds()
                   print('DRV_RSI_GATE',cutoff,'last_second_candle',row['candle_date_time_kst'],'price',row['trade_price'],'age_sec',age,
                     'RSI20',round(mt.rsi20(previous,row['trade_price']) or -1,6),
                     'NOT_VERIFIED_APP_WS_RECEIPT_OR_RANK_OR_LATCH')
             else:
               for sec in (55,56):
                 cutoff=target+('%02d'%sec)
                 eligible=[x for x in seconds if x['candle_date_time_kst']<=cutoff]
                 row=eligible[-1] if eligible else None
                 if row:
                   age=(dt.datetime.fromisoformat(cutoff)-dt.datetime.fromisoformat(row['candle_date_time_kst'])).total_seconds()
                   print('SKR_MA_GATE',cutoff,'last_second_candle',row['candle_date_time_kst'],'price',row['trade_price'],'age_sec',age,
                     'VERDICT',ma.upward_transition_on_forming(previous,row['trade_price'],4.5),
                     'NOT_VERIFIED_APP_ORDERBOOK_OR_ORDER_OR_FILL')
               bar=next((x for x in bars if x['candle_date_time_kst']==barstart),None)
               if bar:
                 lo,hi=bar['low_price'],bar['high_price']
                 qualified=[]
                 for i in range(1001):
                   price=lo+(hi-lo)*i/1000
                   v=ma.upward_transition_on_forming(previous,price,4.5)
                   if v['kind']=='REVERSAL_UP':qualified.append(price)
                 print('SKR_POSSIBLE_UP_FIRST_FLIP_PRICES_WITHIN_HOURLY_LOW_HIGH',
                   (min(qualified),max(qualified),len(qualified)) if qualified else 'NONE_IN_1001_SAMPLES')
          PY
