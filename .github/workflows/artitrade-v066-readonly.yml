    paths: [ '.github/workflows/artitrade-v066-readonly.yml', 'ARTITRADE_ANDROID/ui_tests/audit_v066_stock_quotes.py' ]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
