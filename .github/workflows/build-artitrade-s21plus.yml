name: Build ARTITRADE S21 Plus Android clients
on:
  workflow_dispatch:
  push:
    branches: [ main, artitrade-phone-main-v070-live-orders-20261112 ]
    paths:
      - 'ARTITRADE_ANDROID/BUILD_V078_FINAL_TRIGGER.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/build-artitrade-s21plus.yml'

permissions:
  contents: read


concurrency:
  group: artitrade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python 3.11 for Chaquopy
        run: |
          python3.11 --version
          command -v python3.11
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore stable ARTITRADE update signing key
        id: artitrade-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Create first stable ARTITRADE update signing key
        if: steps.artitrade-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=ARTITRADE S21 Plus Update,O=ARTITRADE,C=KR"             -keyalg RSA -keysize 2048 -validity 10000
      - name: Verify stable signing certificate
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey             | grep -E "SHA256:|Valid from:"
      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate v0.7.1 Android live bridge overlay
        shell: bash
        run: |
          cat ARTITRADE_ANDROID/app/src/main/assets/live_bridge_v071/part_0{0..7}.txt > /tmp/android_live_bridge_v071.gz.b64
          base64 -d /tmp/android_live_bridge_v071.gz.b64 > /tmp/android_live_bridge_v071.py.gz
          gzip -dc /tmp/android_live_bridge_v071.py.gz > /tmp/android_live_bridge_v071.py
          python3 -m py_compile /tmp/android_live_bridge_v071.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/android_live_bridge_v071.py')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          want='e9b35b0fa97ad8ee4a3150d89055e001a04f5dfb048beb13f3e50bec722bb88e'
          print('live bridge sha256',got)
          assert got==want,(got,want)
          PY
      - name: Validate v0.7.8 EXE parity, migration, actual dashboard and incremental sync
        shell: bash
        run: |
          python3 -m py_compile ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          python3 -m py_compile ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "DEFAULT_SEED=2_000_000" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "DEFAULT_MAX=4" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "PER_ACCOUNT_V076" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "v19.MAX_POSITIONS_BY_TF" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "rt.stock_runner.ma.settings(values)" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "ledger.save_allocation(payload)" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "'close':{'seed':DEFAULT_SEED,'max_positions':DEFAULT_MAX}" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "'gmo':{'seed':DEFAULT_SEED,'max_positions':DEFAULT_MAX}" ARTITRADE_ANDROID/app/src/main/python/android_operation_bridge.py
          grep -F "GMOService" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F '"alg":"HS512"' ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "_hub_records_v078" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "_stock_at_v19_full" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "_coin_full" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "_target_summary" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "_close_full" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "actual_summary" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "virtual_summary" ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -F "stock/PROJECTGMO_V1.0" ARTITRADE_ANDROID/pc_tools/artitrade_ledger_migrator.py
          python3 -m py_compile ARTITRADE_ANDROID/pc_tools/artitrade_ledger_migrator.py
          grep -F "ARTITRADE_PC_LEDGER_MIGRATION_V1" ARTITRADE_ANDROID/pc_tools/artitrade_ledger_migrator.py
      - name: Verify PC restore lifecycle and publishing audit safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          j=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile')
          migration=(j/'LegacyLedgerMigration.java').read_text()
          service=(j/'UnifiedTradingService.java').read_text()
          screen=(j/'UnifiedVisualActivity.java').read_text()
          assert 'finishRuntimeVerification' in migration and 'runtimeRows(records)' in migration
          assert 'JSONObject verification=verifyInstalled(manifest,false);' in migration
          assert 'migrationAck(session,sha)' in migration and 'ACK is intentionally delayed' in migration
          assert 'File parent=target.getParentFile();' in migration
          assert 'checkPendingPCArchive(hub)' in service
          assert 'APPLY_PC_MIGRATION' in service and 'migrationRestarting' in service
          assert 'successful*100L' in service
          assert '전체 '+ '' in screen and '실패 ' in screen
          assert 'PC 원장 적용 · 실제 데이터 재검증' in screen
          assert 'stock/close/AT_CLOSE_PAPER.sqlite3' in migration
          assert 'backupWithWal' in migration and 'removeStaleWal' in migration
          assert 'repairLegacyClosePath()' in migration
          assert 'verifyInstalled(manifest,true)' in migration
          assert 'verifyInstalled(manifest,false)' in migration
          assert 'PC_LEDGER_NOT_VISIBLE' in migration
          assert 'by_strategy' in screen
          # The ZIP embedded in the real strategy APK is the source of truth for CLOSE DB placement.
          from io import BytesIO
          import base64,zipfile
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          zipped=base64.b64decode(b''.join((p/f'part_{i:02d}.txt').read_bytes() for i in range(22)))
          with zipfile.ZipFile(BytesIO(zipped)) as core:
              bridge=core.read('android_live_bridge.py').decode('utf-8')
          assert "self.close_store=AtCloseStore(stock_root/'close')" in bridge
          assert 'stock/close/AT_CLOSE_PAPER.sqlite3' in migration
          print('RESTORE_LIFECYCLE_STATIC_CHECKS_OK')
          PY
      - name: Validate strategy tabs, unsaved operation drafts, compact metrics and Kiwoom WAIT diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('ARTITRADE_ANDROID/app/src/main')
          ui=(src/'java/com/artitrade/mobile/UnifiedVisualActivity.java').read_text()
          visuals=(src/'java/com/artitrade/mobile/ArtitradeVisualViews.java').read_text()
          service=(src/'java/com/artitrade/mobile/UnifiedTradingService.java').read_text()
          py=(src/'python/android_runtime_v078.py').read_text()
          assert 'strategy=item[0];persistNavigation();showShell();' in ui
          assert 'strategy=item[0];page="home"' not in ui
          assert 'if(!"operation".equals(page)' in ui and 'ledgerChanged||"home".equals(page)' in ui
          assert 'artitrade_operation_drafts_v1' in ui
          assert 'trackOperationDraft(seedEdit,key+".seed")' in ui
          assert 'trackOperationDraft(maxEdit,key+".max_positions")' in ui
          assert 'clearSavedOperationDrafts(market)' in ui
          assert 'new LinearLayout.LayoutParams(-1,dp(180))' in ui
          assert 'originalStepH*(2f/3f)' in visuals
          assert 'showKiwoomFeedDiagnosis' in ui
          assert 'stockFeed.optInt("subscribed",0)' in service
          assert 'stockFeed.optLong("last_frame_ms",0L)' in service
          assert "_confirmed_ws_session" in py
          assert "transport.get('state') == 'connected'" in py
          assert '_phone_stock_progress' in py and 'ANDROID_KIWOOM_FEED_FATAL' in py
          print('TAB_DRAFT_FLOW_KIWOOM_DIAGNOSTIC_TEST_OK')
          PY
      - name: Validate immutable first-PC-import checkpoint and phone continuation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile')
          import_code=(root/'LegacyLedgerMigration.java').read_text()
          service=(root/'UnifiedTradingService.java').read_text()
          assert 'PC_IMPORT_CHECKPOINT_INCOMPLETE' in import_code
          assert 'PHONE_LEDGER_VERIFY_FAILED' in import_code
          assert 'pc_import_locked",true' in import_code
          assert import_code.index('if(!imported.isEmpty()){') < import_code.index('hub.migrationStatus()')
          assert import_code.index('putString("imported_sha256",sha)') < import_code.index('migrationAck(session,sha)')
          assert service.index('if(!installed.isEmpty())return;') < service.index('hub.migrationStatus()')
          print('PHONE_LEDGER_FIRST_IMPORT_LOCK_CHECK_OK')
          PY
      - name: Verify v0.7.13 non-destructive ledger recovery, CLOSE views and MA pending diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          java=root/'java/com/artitrade/mobile'
          migration=(java/'LegacyLedgerMigration.java').read_text()
          service=(java/'UnifiedTradingService.java').read_text()
          bridge=(java/'StrategyRuntimeBridge.java').read_text()
          ui=(java/'UnifiedVisualActivity.java').read_text()
          runtime=(root/'python/android_runtime_v078.py').read_text()
          ast.parse(runtime)
          assert "Path(self.root)/'stock'/'close'/'AT_CLOSE_PAPER.sqlite3'" in runtime
          assert "Path(root)/'stock'/'close'/'AT_CLOSE_PAPER.sqlite3'" in runtime
          assert "'stock'/'AT_CLOSE'/'AT_CLOSE_PAPER.sqlite3'" not in runtime
          assert 'stock_ma_pending_diagnostics' in runtime
          assert "status='EXPIRED'" in runtime and "UPDATE candidates" in runtime
          assert 'def ledger_audit(manifest_json)' in runtime
          assert 'SQLITE_READ_ERROR' in runtime and "PRAGMA query_only=ON" in runtime
          assert 'installed_sha256' in migration and 'installed_manifest' in migration
          assert 'reuse_existing_files",true' in migration
          assert 'CLOSE_LEDGER_CONFLICT' not in migration
          assert migration.index('putString("installed_sha256",sha)') < migration.index('verifyInstalled(manifest,true)')
          assert 'strategy.ledgerAudit(migration.optJSONObject("manifest"))' in service
          assert 'synchronized JSONObject ledgerAudit(JSONObject manifest)' in bridge
          assert 'python_db_audit' in migration and 'python_db_audit' in ui
          assert "PC_IMPORT_CHECKPOINT_INCOMPLETE" in migration
          print('LEDGER_CLOSE_MA_REGRESSION_CHECK_OK')
          PY
      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src, out in [('dashboard.html','/tmp/artitrade_mobile_dashboard.js'),('unified_dashboard.html','/tmp/artitrade_unified_dashboard.js')]:
              html = Path('ARTITRADE_ANDROID/app/src/main/assets/'+src).read_text(encoding='utf-8')
              matches = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
              assert len(matches) == 1, f'{src} must contain one inline JavaScript module'
              Path(out).write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/artitrade_mobile_dashboard.js
          node --check /tmp/artitrade_unified_dashboard.js

      - name: Check original package and explicit update signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ARTITRADE_ANDROID/app/build.gradle').read_text()
          assert "applicationId 'com.artitrade.unified.s21dex'" in s
          assert "versionName '0.7.17-FILTER-TRENDS-LEDGER'" in s
          assert "versionCode 28" in s
          assert "signingConfig signingConfigs.ciStable" in s
          assert "storeFile file((System.getenv('HOME')" in s
          print('ORIGINAL_PACKAGE_AND_STABLE_SIGNING_CONFIG_OK')
          PY
      - name: Regression test PC migration archive and legacy sidecar recovery
        shell: bash
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/pc_tools -p 'test_migrator_archive_members.py' -v
          python3 - <<'PY'
          from pathlib import Path
          migration=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/LegacyLedgerMigration.java').read_text()
          pc=Path('ARTITRADE_ANDROID/pc_tools/artitrade_ledger_migrator.py').read_text()
          assert 'private static boolean isSnapshotSidecar(String name)' in migration
          assert 'if(isSnapshotSidecar(name)){' in migration
          assert 'ALLOWED.contains(name)||isSnapshotSidecar(name)' in migration
          assert 'for member in sorted(("manifest.json", *manifest["files"].keys())):' in pc
          assert 'stage.rglob("*")' not in pc
          print('LEGACY_SIDECAR_RECOVERY_AND_STRICT_PC_ZIP_OK')
          PY
      - name: Verify preloaded ledger UI, preserved originals and bounded history views
        shell: bash
        run: |
          set -euo pipefail
          TEST_OUT="$(mktemp -d)"
          javac -d "$TEST_OUT" ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistoryPager.java ARTITRADE_ANDROID/ui_tests/HistoryPagerTest.java
          java -cp "$TEST_OUT" com.artitrade.mobile.HistoryPagerTest
          python3 - <<'PY'
          from pathlib import Path
          src=Path("ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java").read_text()
          assert "new JSONObject(cache.toString())" not in src
          assert "private volatile UiSnapshot uiSnapshot" in src
          assert "calculateStats(packet,m,stg)" in src
          assert "calculateStatsTf(packet,m,stg,tf,st)" in src
          assert 'HistoryPager.end(first,a.length())' in src
          assert 'addHistoryPager("research",st.research.length())' in src
          assert 'addHistoryPager("scores",items.length())' in src
          assert 'addHistoryPager("errors",all.length())' in src
          assert 'DRAWER_PROGRESS_REFRESH_MS=750L' in src
          assert "main.post(drawerProgressTicker)" in src
          assert "stopDrawerProgressTicker()" in src
          print("LEDGER_PRELOAD_PAGINATION_DRAWER_REGRESSION_OK")
          PY
      - name: Regression test v0.7.17 five date/value charts, all-account filters, coin position recovery
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          javac -d "$TEST_DIR" \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistoryPager.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HistorySelection.java \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/RealizedTrend.java \
            ARTITRADE_ANDROID/ui_tests/HistoryPagerTest.java \
            ARTITRADE_ANDROID/ui_tests/HistorySelectionTest.java \
            ARTITRADE_ANDROID/ui_tests/RealizedTrendTest.java
          for klass in HistoryPagerTest HistorySelectionTest RealizedTrendTest; do
            java -cp "$TEST_DIR" "com.artitrade.mobile.$klass"
          done
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_coin_ui_mapping.py' -v
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          ui=(root/'java/com/artitrade/mobile/UnifiedVisualActivity.java').read_text()
          visuals=(root/'java/com/artitrade/mobile/ArtitradeVisualViews.java').read_text()
          coin=(root/'python/android_runtime_v078.py').read_text()
          checks={
            'market-wide list filter':'showHistoryFilterMenu(Button anchor)' in ui,
            'row strategy tag':'HistorySelection.strategyTag(item.source,item.frame)' in ui,
            'persist navigation':'restoreNavigation(state)' in ui and 'onSaveInstanceState(Bundle state)' in ui,
            'preload audit':'화면 사전로딩:' in ui,
            'GMO audit':'PC 수급매매 승계 확인' in ui,
            'full-width trend':'addTrendCard("all","전 계좌 통합 추세",null)' in ui,
            'five minute/30 minute':'addTrendCard("5m","5분봉", "30m")' in ui,
            'hour/daily':'addTrendCard("60m","1시간봉","day")' in ui,
            'time/amount axis':'drawXAxisLabels' in visuals and 'compactMoney' in visuals,
            'coin fields retained':'positions=_normalize_coin_holdings(positions,all_positions)' in coin,
            'GMO missing diagnosis':"PC_SOURCE_NOT_PRESENT" in coin,
          }
          for name,ok in checks.items():
              print(name, 'PASS' if ok else 'FAIL')
          assert all(checks.values())
          print('ARTITRADE_V0717_REGRESSION_OK')
          PY
      - name: Build stock, coin, unified and MSERVER APKs
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleStockDebug :app:assembleCoinDebug :app:assembleUnifiedDebug :app:assembleHubDebug --stacktrace
      - name: Validate unified native launcher
        shell: bash
        run: |
          APK="ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/unified_badging.txt
          grep -F "launchable-activity: name='com.artitrade.mobile.UnifiedVisualActivity'" /tmp/unified_badging.txt
          grep -F "package: name='com.artitrade.unified.s21dex'" /tmp/unified_badging.txt
          ! grep -q "android.webkit.WebView" ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"대시보드"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'new String[]{"5m","30m","60m","day"}' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"주식 전체 오류이력"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java || grep -F '+" 전체 오류이력"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'openSettingsDrawer' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'BrokerApiProbe.all' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'TimeframeAccountFlowView' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'STOCK CLOSE PNL FIX2' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'COIN FIX38 SR1 POLICY' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '실제 목표도달율' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '실제 매수 목표도달율' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '가상진입 목표도달율' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '엔진 점수 비교' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '① 폰 기준원장 → MSERVER 게시' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '② 기존 PC EXE 원장 → S21+ 승계' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          ! grep -F '연구 진행' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'recordMeta' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/LocalHubClient.java
          grep -F '/v1/record/meta' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HubServer.java
          grep -F 'getRecordMeta' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStore.java
          grep -F 'artitrade_mserver_record_hash_v078' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedTradingService.java
          grep -F 'bottomNavItem("home","⌂","대시보드")' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'using_hub_fallback' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'HmacSHA512' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/BrokerApiProbe.java
          grep -F 'HmacSHA512' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UpbitRealtimeClient.java
          grep -F 'LegacyLedgerMigration' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedTradingService.java
          grep -F 'RECORD_MAX_BYTES=32*1024*1024' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/SyncStore.java
          grep -F 'MAX_BODY=36*1024*1024' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/HubServer.java
          grep -F 'MSERVER 인증 실패' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '연구자료 추출' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"보유종목"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"매수대기"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"체결이력"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F '"연구자료"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'operationFields.put(key,new EditText[]{seedEdit,maxEdit})' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'addFrameOperationSection("기준봉", "stock","at"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'addFrameOperationSection("MA", "stock","ma"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'addFrameOperationSection("기준봉", "coin","general"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'addFrameOperationSection("MA", "coin","ma"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'operationSingleCard("stock","close","종가베팅"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'operationSingleCard("stock","gmo","수급매매"' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/UnifiedVisualActivity.java
          grep -F 'ANDROID_KEYSTORE_LOCAL' ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/LocalHubClient.java
