name: Build ARTITRADE S21 Plus Android clients
on:
  workflow_dispatch:
  push:
    branches: [ main, artitrade-phone-main-v070-live-orders-20261112 ]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/build-artitrade-s21plus.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/build-artitrade-s21plus.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python 3.11 for Chaquopy
        run: |
          python3.11 --version
          command -v python3.11
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src, out in [('dashboard.html','/tmp/artitrade_mobile_dashboard.js'),('unified_dashboard.html','/tmp/artitrade_unified_dashboard.js')]:
              html = Path('ARTITRADE_ANDROID/app/src/main/assets/'+src).read_text(encoding='utf-8')
              matches = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
              assert len(matches) == 1, f'{src} must contain one inline JavaScript module'
              Path(out).write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/artitrade_mobile_dashboard.js
          node --check /tmp/artitrade_unified_dashboard.js

      - name: Build stock, coin, unified and phone hub APKs
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleStockDebug :app:assembleCoinDebug :app:assembleUnifiedDebug :app:assembleHubDebug --stacktrace
      - name: Create version-labeled APK files
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, re, shutil
          from pathlib import Path

          root = Path("ARTITRADE_ANDROID/app/build/outputs/apk")
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")
          for flavor, label in (
              ("stock", "ARTITRADE_STOCK"),
              ("coin", "ARTITRADE_COIN"),
              ("unified", "ARTITRADE_UNIFIED"),
              ("hub", "ARTITRADE_PHONE_SERVER"),
          ):
              directory = root / flavor / "debug"
              meta = json.loads((directory / "output-metadata.json").read_text(encoding="utf-8"))
              elements = meta.get("elements") or []
              if len(elements) != 1:
                  raise RuntimeError(f"Expected one APK for {flavor}, got {len(elements)}")
              element = elements[0]
              version = element.get("versionName")
              if not version:
                  raise RuntimeError(f"APK versionName missing for {flavor}")
              safe_version = re.sub(r"[^A-Za-z0-9._-]", "_", str(version))
              source = directory / element["outputFile"]
              destination = directory / f"{label}_v{safe_version}_{today}.apk"
              shutil.copy2(source, destination)
              print(f"Created {destination} ({destination.stat().st_size} bytes)")
          PY
      - name: Install Korean preview fonts
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Render compact and DeX UI previews
        shell: bash
        run: |
          mkdir -p ui-previews
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chrome is not installed on the runner; skipping preview."
          else
            PAGE="file://$(pwd)/ARTITRADE_ANDROID/app/src/main/assets/unified_dashboard.html"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=990,450 --screenshot=ui-previews/artitrade_unified_s21.png "$PAGE" || true
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1400,900 --screenshot=ui-previews/artitrade_unified_dex.png "$PAGE" || true
          fi
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_Number_First_UI_Previews
          path: ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_S21PLUS_VERSIONED_APKs
          if-no-files-found: error
          retention-days: 14
          path: |
            ARTITRADE_ANDROID/app/build/outputs/apk/stock/debug/ARTITRADE_*.apk
            ARTITRADE_ANDROID/app/build/outputs/apk/coin/debug/ARTITRADE_*.apk
            ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/ARTITRADE_*.apk
            ARTITRADE_ANDROID/app/build/outputs/apk/hub/debug/ARTITRADE_*.apk
