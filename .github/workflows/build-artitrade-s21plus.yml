name: Build ARTITRADE S21 Plus Android clients
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/build-artitrade-s21plus.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/build-artitrade-s21plus.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('ARTITRADE_ANDROID/app/src/main/assets/dashboard.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          assert len(matches) == 1, 'Dashboard must contain one inline JavaScript module'
          Path('/tmp/artitrade_mobile_dashboard.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/artitrade_mobile_dashboard.js

      - name: Build stock, coin and phone hub APKs
        working-directory: ARTITRADE_ANDROID
        run: gradle --no-daemon :app:assembleStockDebug :app:assembleCoinDebug :app:assembleHubDebug --stacktrace
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_S21PLUS_NUMBER_FIRST_UI_TEST_APKs
          if-no-files-found: error
          retention-days: 14
          path: |
            ARTITRADE_ANDROID/app/build/outputs/apk/stock/debug/*.apk
            ARTITRADE_ANDROID/app/build/outputs/apk/coin/debug/*.apk
            ARTITRADE_ANDROID/app/build/outputs/apk/hub/debug/*.apk
