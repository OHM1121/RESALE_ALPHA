name: ARTITRADE 0.0.12 legacy PAPER purge + 11.18 holdings + signer TEST APK
on:
  push:
    branches: [artitrade-phone-main-v070-live-orders-20261112]
    paths:
      - .github/workflows/artitrade-012-original-signer-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artitrade-012-cross-strategy-original-signer
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      ARTIFACT: ARTITRADE_0.0.12
      TAG: ARTITRADE-0.0.12-signed-test-20261119
      SOURCE: a40a2b4e99bfd1edb57bfea8d6225051800dd22b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a40a2b4e99bfd1edb57bfea8d6225051800dd22b
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require exact previously installed signer
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: artitrade-s21plus-update-signing-v1
      - name: Verify signing identity before any compilation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.cache-hit }}" = "true"
          test -s "$HOME/.android/debug.keystore"
          fp="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "COMPUTED_SIGNER_SHA256=$fp"
          test "$fp" = "37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6"
      - name: Apply verified original vendor quote fixes in isolated build checkout, preserve 0.0.12 identity
        shell: bash
        run: |
          set -euo pipefail
          # The prior verified patch scripts expect old source Gradle metadata.
          # Apply them on THIS ephemeral checkout only; restore 0.0.12 afterward.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ARTITRADE_ANDROID/app/build.gradle")
          s=p.read_text("utf8")
          assert s.count("versionCode 134")==1
          # The MSERVER hub flavor also legitimately uses versionName 0.0.2.
          # Only the unified (phone) flavor is temporarily rewritten for
          # the proven quote patch scripts; never touch the hub version.
          assert s.count("versionName '0.0.12'")==1
          assert s.count("versionName '0.0.2'")==1
          assert s.count("applicationId 'com.artitrade.unified.s21dex'")==1
          old="versionCode 134\n            versionName '0.0.12'"
          new="versionCode 97\n            versionName '0.7.91-MA-STAGE-LEDGER'"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s,"utf8")
          PY
          python3 ARTITRADE_ANDROID/ui_tests/patch_v092_realtime_ws_latency.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v093_strategy_priority_metadata.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v105_ka10004_readonly.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v008_native_krx_special.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v009_native_krx_history_gmo_dns.py
          python3 ARTITRADE_ANDROID/ui_tests/patch_v010_native_market_clock.py | tee /tmp/artitrade-v009-native.txt
          grep '^NEW_SHA256=' /tmp/artitrade-v009-native.txt | sed 's/^NEW_SHA256=/ARTITRADE_APPROVED_VENDOR_PATCHED_SHA256=/' >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ARTITRADE_ANDROID/app/build.gradle")
          s=p.read_text("utf8")
          assert s.count("versionCode 99")==1
          assert s.count("versionName '0.7.93-STOCK-SUBSCRIPTION-PRIORITY'")==1
          s=s.replace("versionCode 99","versionCode 134").replace(
              "versionName '0.7.93-STOCK-SUBSCRIPTION-PRIORITY'","versionName '0.0.12'")
          assert s.count("versionCode 134")==1 and s.count("versionName '0.0.12'")==1 and s.count("versionName '0.0.2'")==1
          p.write_text(s,"utf8")
          PY
      - name: Source compilation and original embedded strategy SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 - <<'PY'
          import ast,base64,hashlib,io,zipfile
          from pathlib import Path
          main=Path('ARTITRADE_ANDROID/app/src/main')
          original=main/'assets/strategy_v070'
          data=base64.b64decode(''.join((original/('part_%02d.txt'%i)).read_text('ascii') for i in range(22)))
          sha=hashlib.sha256(data).hexdigest()
          bridge=(main/'java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text('utf8')
          assert 'CORE_SHA256="'+sha+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              live=z.read('d_live.py').decode('utf8')
              coin=z.read('d_upbit.py').decode('utf8')
              assert "('ka10004','/api/dostk/mrkcond')" in live
              assert 'async def _v092_read_login_ack(' in live
              assert "depth_codes=sorted(code+'.15'" in coin
              for name in z.namelist():
                  if name.endswith('.py'):ast.parse(z.read(name).decode('utf8'),filename=name)
              z.extractall('/tmp/artitrade-002-native')
          print('EXACT_VENDOR_CORE_AND_VENDOR_QUOTE_PATCHES_PASS',sha)
          PY
      - name: Validate six recovery scenarios, live-source score integrity and eight PAPER engines
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-002-native:$PWD/ARTITRADE_ANDROID/ui_tests"
          for pattern in \
            test_v008_special_session_trend_proof.py \
            test_v009_forensic_krx_gmo_ma_dns.py \
            test_v010_gmo_capture_recovery_signature.py \
            test_v010_gmo_d1_or_0b_recovery.py \
            test_v010_native_market_clock.py \
            test_v011_new_legacy_resting_and_legacy_retirement.py \
            test_v012_legacy_purge_and_holding_frame.py \
            test_v008_broker_sell_receipt.py \
            test_v008_bollinger_pixel_geometry.py \
            test_v008_all_strategy_rootcause.py \
            test_v097_gmo_preplan.py \
            test_v093_strategy_subscription_priority.py \
            test_v075_gmo_cw_original_failure_audit.py \
            test_v090_gmo_open_priority_worker.py \
            test_v108_native_ma_trend_entry_paths.py \
            test_v007_error_history_root_contracts.py \
            test_v006_trend_5m_retirement_and_startup.py \
            test_new_legacy_1118_workbook.py \
            test_new_legacy_1118_ai_basis.py \
            test_v1118_fresh_score_bootstrap.py \
            test_v002_post_reset_trend_and_top50.py \
            test_v002_eight_virtual_paper_end_to_end.py \
            test_v004_abnormal_reconnect_six.py \
            test_v005_market_score_empty_wallet.py \
            test_v002_ledger_rollback_guard.py \
            test_v003_daily_market_backup.py \
            test_v106_fresh_paper_epoch.py \
            test_v108_mandatory_first_epoch.py \
            test_v107_at_negative_market_gate.py \
            test_v107_entry_plan_epoch.py \
            test_v092_scenarios_8_wallets.py \
            test_v095_trade_basis_ai.py \
            test_v086_stock_manual_all.py \
            test_v100_d19_native_manual_exit.py \
            test_v101_zip95_analysis_ready.py; do
            echo "TESTING $pattern"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pattern" -v
          done
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('ARTITRADE_ANDROID/app/build.gradle').read_text()
          assert "versionCode 134" in gradle and "versionName '0.0.12'" in gradle
          java=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/FreshEpochGateV106.java').read_text()
          assert "COMMITTED_EPOCH_MARKER_REWOUND_TO_PREPARING_NO_RESET" in java
          assert "applied_epoch_id" in java
          print('NO_SECOND_PAPER_LEDGER_WIPE_AND_SAME_APK_ID')
          PY
      - name: Enforce graph/issue registry against the exact packaged source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/artitrade/build_source_graph.py --output artitrade_source_graph.json
          python3 tools/artitrade/validate_dependency_contracts.py --generated artitrade_source_graph.json
      - name: Build arm64 unified Android package with exact existing signer
        working-directory: ARTITRADE_ANDROID
        shell: bash
        run: gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
      - name: Verify APK package, strict numeric version and unchanged certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=ARTITRADE_ANDROID/app/build/outputs/apk/unified/debug/app-unified-debug.apk
          test -s "$apk"
          pkg="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package: ')"
          case "$pkg" in
            *"name='com.artitrade.unified.s21dex' versionCode='134' versionName='0.0.12'"*) ;;
            *) echo "INVALID_APK_PACKAGE_OR_NUMERIC_VERSION: $pkg" >&2; exit 1;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /tmp/artitrade_002_signer.txt
          grep -iF '37967ed67598f4137045db4a31b16e156993f6c7c88c9d93d0905b27d5f723c6' /tmp/artitrade_002_signer.txt
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/'
          cp "$apk" "$ARTIFACT.apk"
          sha256sum "$ARTIFACT.apk" > "$ARTIFACT.sha256"
          printf 'versionName=0.0.12\nversionCode=134\npackage=com.artitrade.unified.s21dex\nsource=%s\noriginal_epoch_preserved=true\nactual_samsung_fills_verified=false\nreal_broker_enabled=false\nreal_broker_sell_orders_not_automatically_placed=true\n' "$SOURCE" > "$ARTIFACT.txt"
      - name: Verify exact source commit was checked out for release
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Upload verified APK as GitHub Actions download
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_0_0_12_FORENSIC_FIXED_SIGNED_APK
          path: |
            ARTITRADE_0.0.12.apk
            ARTITRADE_0.0.12.sha256
            ARTITRADE_0.0.12.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified signed APK direct prerelease download
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          sha256sum -c "$ARTIFACT.sha256"
          echo "ARTITRADE 0.0.12 PAPER TEST APK, same package com.artitrade.unified.s21dex, same previously installed signing certificate, versionCode134. User-authorized old-PAPER trade removal with original cash/PnL correction and independent rollback-guard rebasing at startup. Keeps NEW LEGACY(11.18) entries, removes identified old buy/sell/holdings/related research only for AT/MA/Trend stock+coin. GMO and CW excluded entirely. Ambiguous broker or orphaned old records remain untouched rather than inventing accounting. Holding badge shows 5분/30분/60분/일봉 and removes duplicate timeframe after name. All 8 paper strategy regressions. Real broker disabled and live resting broker orders not placed; Samsung-device validation and stock AT pending→fill unresolved. Do not uninstall existing app." > /tmp/artitrade-v012-notes
          gh release create "$TAG" "$ARTIFACT.apk" "$ARTIFACT.sha256" "$ARTIFACT.txt" --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "ARTITRADE 0.0.12 signed TEST APK (PAPER)" --notes-file /tmp/artitrade-v012-notes --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,tagName --jq '{tagName:.tagName,assets:[.assets[].name]}'
