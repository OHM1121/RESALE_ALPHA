name: ARTITRADE Android emulator screen and ledger smoke
on:
  workflow_dispatch:
  push:
    branches: [ artitrade-phone-main-v070-live-orders-20261112 ]
    paths:
      - 'ARTITRADE_ANDROID/EMULATOR_SMOKE_TRIGGER.txt'
permissions:
  contents: read
concurrency:
  group: artitrade-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout exact Android source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build executable x86_64 emulator variant from same source
        env:
          ARTITRADE_EMULATOR_ABI: x86_64
        working-directory: ARTITRADE_ANDROID
        run: |
          gradle --no-daemon :app:assembleUnifiedDebug --stacktrace
          mkdir -p ../downloaded-apks
          cp app/build/outputs/apk/unified/debug/app-unified-debug.apk ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_x86_64.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../downloaded-apks/ARTITRADE_UNIFIED_EMULATOR_x86_64.apk | grep -E "package:|launchable-activity:"
      - name: Boot Android 15, install APK and exercise all 6 strategy screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ARTITRADE_ANDROID/ui_tests/android_emulator_smoke.py
      - name: Upload screenshots and AndroidRuntime evidence even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARTITRADE_EMULATOR_SCREEN_DATA_AUDIT
          path: ui-smoke/**
          retention-days: 14
          if-no-files-found: ignore
