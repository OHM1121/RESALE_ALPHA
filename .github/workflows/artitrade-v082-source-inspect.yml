name: ARTITRADE v082 inspect execution evidence and partial-sell journal
on:
  push:
    branches: [ artitrade-v082-lazy-execution-details-partial-exit-20261116 ]
    paths: [ '.github/workflows/artitrade-v082-source-inspect.yml' ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect immutable exact trade evidence reader and coin MA partial SELL schema
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile,io,re
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          for folder,parts in [('strategy_v070',22),('live_bridge_v071',9)]:
              p=root/'assets'/folder
              z=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(parts)))
              print('==== ARCHIVE',folder,'SHA',hashlib.sha256(z).hexdigest())
              with zipfile.ZipFile(io.BytesIO(z)) as f:
                  for name in f.namelist():
                      if not name.endswith('.py'):continue
                      if re.search('trade_history_evidence|d_upbit|ma.*coin|post_exit|d_live|android_live_bridge',name,re.I):
                          print('==== SOURCE',name)
                          if re.search('trade_history_evidence',name):
                              lines=f.read(name).decode(errors='replace').splitlines()
                              for i,line in enumerate(lines[:420]):
                                  print('LINE',i+1,line[:245])
                          elif name=='d_upbit.py':
                              lines=f.read(name).decode(errors='replace').splitlines()
                              for i,line in enumerate(lines):
                                  if re.search(r'CREATE TABLE IF NOT EXISTS (executions|positions)|INSERT INTO executions|INSERT OR REPLACE INTO executions|CREATE TABLE executions|UPDATE positions SET|INSERT INTO positions',line,re.I):
                                      print('HIT',i+1,line[:210])
                                      for j in range(max(0,i-6),min(len(lines),i+13)):
                                          print('CTX',j+1,lines[j][:235])
          PY
