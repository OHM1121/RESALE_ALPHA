name: ARTITRADE v082 inspect execution evidence and partial-sell journal
on:
  push:
    branches: [ artitrade-v082-lazy-execution-details-partial-exit-20261116 ]
    paths: [ '.github/workflows/artitrade-v082-source-inspect.yml' ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect immutable exact trade evidence reader and coin MA partial SELL schema
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile,io,re
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main')
          p=root/'assets/strategy_v070'
          z=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(z)) as f:
              print('==== ZIP ENTRIES',len(f.namelist()))
              for name,ranges in [('d_upbit.py',[(705,760),(2075,2140),(2160,2238)]),
                                   ('d_live.py',[(200,240)]),
                                   ('android_live_bridge.py',[(1,120)])]:
                  if name not in f.namelist():continue
                  ls=f.read(name).decode(errors='replace').splitlines()
                  print('==== FILE',name,'TOTAL',len(ls))
                  for lo,hi in ranges:
                      for i in range(lo-1,min(hi,len(ls))):
                          print('LINE',i+1,ls[i][:240])
              print('==== HAS EVIDENCE MODULE',any('trade_history_evidence' in n for n in f.namelist()))
          import gzip
          p=root/'assets/live_bridge_v071'
          encoded=''.join((p/f'part_{i:02d}.txt').read_text() for i in range(8))
          live=gzip.decompress(base64.b64decode(encoded))
          print('==== LIVE BRIDGE SHA',hashlib.sha256(live).hexdigest())
          ls=live.decode().splitlines()
          for i,x in enumerate(ls):
              if re.search('trade_history_evidence|post.sale|reason|execution',x,re.I):
                  print('BRIDGE HIT',i+1,x[:220])

          PY
