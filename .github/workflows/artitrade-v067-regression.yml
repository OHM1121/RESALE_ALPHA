name: ARTITRADE v067 MA Trend Kiwoom independent regression
on:
  push:
    branches: [ feature-artitrade-v067-ma-trend-ws-recovery-20261116 ]
    paths:
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_v067_*.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/ma_epoch_v067.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/kiwoom_ws_v067.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/market_trend_runtime_v043.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py'
      - 'ARTITRADE_ANDROID/app/build.gradle'
      - 'ARTITRADE_ANDROID/ui_tests/test_v067_ma_system.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v054_ui.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v054_market_trend_audit.py'
      - '.github/workflows/artitrade-v067-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original regression imports
        run: python3 -m pip install -q requests websockets holidays
      - name: Verify original unchanged bundled engine and extract into temporary isolated folder
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          core=base64.b64decode(''.join((root/('part_%02d.txt'%i)).read_text('ascii') for i in range(22)))
          assert hashlib.sha256(core).hexdigest()=='10ff2cc9cda6ebba1dfa183f893bcea76f38445bb109dac66b99d578cc9c5447'
          dest=Path('/tmp/artitrade-v067-original-core');dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(core)) as z:z.extractall(dest)
          original=(dest/'projectgmo/engine.py').read_text('utf8')
          assert 'entry_profit_floor: float = 0.02' in original
          assert 'ENTRY_PLUS2_FLOOR' in original
          print('UNCHANGED_KIWOOM_GMO_V062_ORIGINAL_CORE')
          PY
      - name: Compile all Python and run strict MA/trend/WS verification
        env:
          PYTHONPATH: '/tmp/artitrade-v067-original-core:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -e
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v067_*.py' -v
      - name: Confirm old MA, Trend, GMO, ledger and updated version legacy parity
        env:
          PYTHONPATH: '/tmp/artitrade-v067-original-core:ARTITRADE_ANDROID/app/src/main/python'
        run: |
          set -e
          for pat in 'test_v066_*.py' 'test_v064_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v053_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -q
          done
      - name: Confirm original trade and MA audit hooks do not mint broker fills
        run: |
          set -e
          grep -Fq 'install_ui_quote_tap(self.stock_runner)' ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -Fq 'from ma_epoch_v067 import install' ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -Fq 'install as _install_kiwoom_ws_v067' ARTITRADE_ANDROID/app/src/main/python/android_runtime_v078.py
          grep -Fq 'versionCode 73' ARTITRADE_ANDROID/app/build.gradle
          git diff --check
