name: ARTITRADE v010 reproduce _gmo_preplan capture recovery traceback source audit
on:
  push:
    branches: [fix-artitrade-010-v009-cross-strategy-rootcause-20261119]
    paths:
      - .github/workflows/artitrade-v010-source-wrapper-audit.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ALL app overlays and original native for monkeypatch capture
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -C 12 -E '(def _gmo_preplan\(|def capture\(|\.prepare\s*=|Preplanner\.prepare|recovery=True)' ARTITRADE_ANDROID/app/src/main/python | head -n 380 || true
          python3 - <<'PY'
          import base64,io,zipfile,re
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for filename in z.namelist():
                  if filename.endswith('.py'):
                      lines=z.read(filename).decode('utf8').splitlines()
                      for i,s in enumerate(lines):
                          if re.search(r'def _gmo_preplan\(|def capture\(|\.prepare\s*=|Preplanner\.prepare',s):
                              print('NATIVE',filename,i+1,'\\n','\\n'.join(lines[max(0,i-5):i+20]))
          PY
