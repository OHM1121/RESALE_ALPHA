name: ARTITRADE v080 inspect exact verified native feed and MA worker APIs
on:
  push:
    branches: [ fix-artitrade-v080-ma-trend-feed-preclose-20261116 ]
    paths: [ '.github/workflows/artitrade-v080-inspect-source.yml' ]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read exact original strategy modules without changing source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile,io,re
          from pathlib import Path
          base=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((base/f'part_{i:02d}.txt').read_text() for i in range(22)))
          bridge=Path('ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java').read_text()
          assert 'CORE_SHA256="'+hashlib.sha256(raw).hexdigest()+'"' in bridge
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              for name in ['d_minute_repair_fast.py','d_live.py','d_upbit.py','coin_ma_engine.py','stock_ma_engine.py']:
                  src=z.read(name).decode()
                  lines=src.splitlines()
                  pats={'d_minute_repair_fast.py':r'exchange_stamp_is_fresh|def .*fresh|def .*preload',
                        'd_live.py':r'_quote_lock|_latest_krx_trades|_new_tick|_read_ws|_watch_feed|_queue|def __init__|class LivePaperRunner',
                        'd_upbit.py':r'ping_interval|ping_timeout|ConnectionClosed|last_book|_both_watched_codes|latest_prices|_websocket|websockets.connect|def candles|def run',
                        'coin_ma_engine.py':r'def process_book|def record_candidate|def _buy|def __init__',
                        'stock_ma_engine.py':r'def on_tick|def __init__|def _connect|_quote_lock'}
                  print('===== FILE',name,'LINES',len(lines),'=====')
                  found=[i for i,x in enumerate(lines) if re.search(pats[name],x,re.I)]
                  for i in found[:55]:
                      print('HIT',i+1,lines[i][:230])
                      if ('exchange_stamp_is_fresh' in lines[i] or
                          'ping_interval' in lines[i] or
                          '_quote_lock' in lines[i] or
                          '_latest_krx_trades' in lines[i]):
                          for j in range(max(0,i-3),min(len(lines),i+8)):
                              print('CONTEXT',j+1,lines[j][:220])
          PY
