name: ARTITRADE v067 native source audit
on:
  push:
    branches: [ feature-artitrade-v067-ma-trend-ws-recovery-20261116 ]
    paths: [ 'ARTITRADE_ANDROID/ui_tests/audit_v067_native.py', '.github/workflows/artitrade-v067-native-audit.yml' ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 ARTITRADE_ANDROID/ui_tests/audit_v067_native.py
