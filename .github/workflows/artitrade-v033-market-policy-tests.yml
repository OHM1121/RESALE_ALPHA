name: ARTITRADE v033 Market Policy Read-Only Research Code Tests
on:
  push:
    branches: [artitrade-v033-market-policy-tracker-20261114]
    paths:
      - 'ARTITRADE_ANDROID/**'
      - '.github/workflows/artitrade-v033-market-policy-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artitrade-v033-code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure score and policy scope regression
        run: |
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v033_market_research.py' -v
          mkdir -p /tmp/artitrade-v033
          javac -d /tmp/artitrade-v033 \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/PolicyHistoryScope.java \
            ARTITRADE_ANDROID/ui_tests/PolicyHistoryScopeTest.java
          java -cp /tmp/artitrade-v033 com.artitrade.mobile.PolicyHistoryScopeTest
      - name: Ensure prior research/core remains intact
        run: |
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v031_research_popup_evidence.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v029_research_loaders.py' -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Java compile-only (no package/no APK)
        run: |
          cd ARTITRADE_ANDROID
          gradle --no-daemon :app:compileUnifiedDebugJavaWithJavac
          test ! -d app/build/outputs/apk
