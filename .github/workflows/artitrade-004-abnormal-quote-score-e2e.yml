name: ARTITRADE 0.0.4 six abnormal quote/score/BUY-SELL E2E NO APK
on:
  push:
    branches: [fix-artitrade-004-restart-gap-recovery-20261119]
    paths:
      - .github/workflows/artitrade-004-abnormal-quote-score-e2e.yml
      - ARTITRADE_ANDROID/app/src/main/python/**
      - ARTITRADE_ANDROID/ui_tests/test_v004_abnormal_reconnect_six.py
      - ARTITRADE_ANDROID/ui_tests/test_v033_market_research.py
      - ARTITRADE_ANDROID/ui_tests/test_v038_market_live_ui.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-native-synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harmless old EXE import dependencies
        run: python3 -m pip install -q requests==2.32.5 websockets==15.0.1 holidays
      - name: Verify and unpack EXACT original eight-strategy native core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,ast
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          payload=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          sha=hashlib.sha256(payload).hexdigest()
          assert sha=='b014a00fd2cc29984650cb7ea24e7ea9672d6480fd68e91a6a1ebbe72754dfbb'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.py'):ast.parse(z.read(name).decode('utf-8'),filename=name)
              z.extractall('/tmp/ARTITRADE_NATIVE_004')
          print('NATIVE_SOURCE_SHA256_OK',sha)
          PY
      - name: Compile current strategy overlays and feed-health module
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
      - name: Six abnormal scenarios + 6 feed/score source tests + eight native E2E
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/ARTITRADE_NATIVE_004:$PWD/ARTITRADE_ANDROID/ui_tests"
          for suite in \
            test_v004_abnormal_reconnect_six.py \
            test_v002_eight_virtual_paper_end_to_end.py \
            test_new_legacy_1118_workbook.py \
            test_v1118_fresh_score_bootstrap.py \
            test_v033_market_research.py \
            test_v038_market_live_ui.py \
            test_v043_market_trend.py \
            test_v054_runtime.py \
            test_v086_stock_manual_all.py \
            test_v106_fresh_paper_epoch.py \
            test_v108_mandatory_first_epoch.py; do
            echo ">>> $suite"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$suite" -v
          done
      - name: Evidence of NO device/broker and no second mandatory ledger reset
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'COMMITTED_EPOCH_MARKER_REWOUND_TO_PREPARING_NO_RESET' \
            ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/FreshEpochGateV106.java
          test ! -d ARTITRADE_ANDROID/app/build/outputs/apk
          echo 'V004_ABNORMAL_E2E_SAFE_NATIVE_ONLY_ALL_PASS'
