name: ARTITRADE v100 original-PAPER manual denial and buy-target audit regression
on:
  push:
    branches: [fix-artitrade-v100-manual-sell-evidence-target-audit-20261118]
    paths:
      - '.github/workflows/verify-v100-manual-denials.yml'
      - 'ARTITRADE_ANDROID/app/src/main/python/android_manual_paper_sell_v085.py'
      - 'ARTITRADE_ANDROID/app/src/main/python/stock_at_policy_reconcile_v091.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v100_manual_denial_and_targets.py'
      - 'ARTITRADE_ANDROID/ui_tests/test_v100_d19_native_manual_exit.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-paper-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Extract immutable original 82-module EXE engine for tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          root=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((root/f'part_{i:02d}.txt').read_text('ascii') for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              z.extractall('/tmp/artitrade-v100-original-core')
          PY
      - name: Test native manual SELL safety and v091 3LEG31 policy
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v100-original-core:$PWD/ARTITRADE_ANDROID/ui_tests"
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v100_manual_denial_and_targets.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v100_d19_native_manual_exit.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v091_d19_original_at_reconnect_and_portrait.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_stock_manual_all.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_manual_0d_sell.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v094_manual_gmo_0d.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v096_manual_result_lifecycle.py' -v
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v092_scenarios_8_wallets.py' -v
