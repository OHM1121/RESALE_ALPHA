name: ARTITRADE v086 full original regression with genuine first-cross tests
on:
  push:
    branches: [ fix-artitrade-v086-rsi-first-cross-feed-gmo-ledger-20261117 ]
    paths: [ '.github/workflows/artitrade-v086-prepare.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin genuine WS ticker/3s book and preserve original 81 untouched modules
        run: python3 ARTITRADE_ANDROID/ui_tests/patch_v086_true_trade_feed.py
      - name: Compile 82-module archive and original project without writes to trading ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ARTITRADE_ANDROID/app/src/main/python ARTITRADE_ANDROID/ui_tests
          python3 - <<'PY'
          import base64,io,zipfile,ast
          from pathlib import Path
          p=Path('ARTITRADE_ANDROID/app/src/main/assets/strategy_v070')
          raw=base64.b64decode(''.join((p/f'part_{i:02d}.txt').read_text() for i in range(22)))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and len(z.namelist())==82
              for n in z.namelist():
                  if n.endswith('.py'):ast.parse(z.read(n).decode())
              z.extractall('/tmp/artitrade-v086-core')
          print('V086_ALL_82_ARCHIVED_MODULES_PARSE_PASS')
          PY
      - name: Run focused first downward RSI, exact GMO net PnL and original v085 safety tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$(pwd)/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v086-core"
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v086_*.py' -q
          python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p 'test_v085_*.py' -q
      - name: Run all original strategy and ledger regression groups
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests websockets holidays
          export PYTHONPATH="$(pwd)/ARTITRADE_ANDROID/app/src/main/python:/tmp/artitrade-v086-core"
          failed=0
          for pat in 'test_v082_*.py' 'test_v081_*.py' 'test_v080_*.py' 'test_v079_*.py' 'test_v077_*.py' 'test_v076_*.py' 'test_android_ledger_backup.py' 'test_v075_*.py' 'test_v074_*.py' 'test_v073_*.py' 'test_v072_*.py' 'test_v071_*.py' 'test_v069_*.py' 'test_v068_*.py' 'test_v067_*.py' 'test_v066_*.py' 'test_v064_*.py' 'test_v063_*.py' 'test_v062_*.py' 'test_v061_*.py' 'test_v060_*.py' 'test_v059_*.py' 'test_v058_*.py' 'test_v057_*.py' 'test_v054_*.py' 'test_v053_*.py' 'test_v051_*.py' 'test_v048_*.py' 'test_v047_*.py' 'test_v042_*.py'; do
            echo "REGRESSION GROUP: $pat"
            python3 -m unittest discover -s ARTITRADE_ANDROID/ui_tests -p "$pat" -q || failed=1
          done
          exit "$failed"
      - name: Commit only fully regression-tested original archive and Gradle version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARTITRADE_ANDROID/app/src/main/assets/strategy_v070 ARTITRADE_ANDROID/app/src/main/java/com/artitrade/mobile/StrategyRuntimeBridge.java ARTITRADE_ANDROID/app/build.gradle ARTITRADE_ANDROID/ui_tests/test_v054_ui.py ARTITRADE_ANDROID/ui_tests/test_v054_market_trend_audit.py ARTITRADE_ANDROID/ui_tests/test_v080_ma_trend_data.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(v086): enforce genuine Upbit trade clock and first RSI threshold cross without changing wallets"
          git push origin HEAD:fix-artitrade-v086-rsi-first-cross-feed-gmo-ledger-20261117
