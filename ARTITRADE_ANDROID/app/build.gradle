plugins {
    id 'com.android.application'
}

android {
    namespace 'com.artitrade.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.artitrade.mobile'
        minSdk 28
        targetSdk 35
        versionCode 9
        versionName '0.4.1-SWIPE-KST-EVENTDATE'
        manifestPlaceholders = [launcherActivity: ".MainActivity"]
    }
    flavorDimensions 'market'
    productFlavors {
        stock {
            dimension 'market'
            applicationId 'com.artitrade.stock.s21dex'
            buildConfigField 'String', 'MARKET', '"stock"'
            resValue 'string', 'app_name', 'ARTITRADE 주식'
        }
        hub {
            dimension 'market'
            versionName '0.2.0-PHONE-SERVER'
            applicationId 'com.artitrade.hub.s21dex'
            buildConfigField 'String', 'MARKET', '"hub"'
            resValue 'string', 'app_name', 'ARTITRADE 폰 서버'
        }
        coin {
            dimension 'market'
            applicationId 'com.artitrade.coin.s21dex'
            buildConfigField 'String', 'MARKET', '"coin"'
            resValue 'string', 'app_name', 'ARTITRADE 코인'
        }
        unified {
            dimension 'market'
            versionName '0.6.0-PHONE-MAIN-DIRECT-REALTIME'
            applicationId 'com.artitrade.unified.s21dex'
            buildConfigField 'String', 'MARKET', '"both"'
            resValue 'string', 'app_name', 'ARTITRADE 통합'
            manifestPlaceholders = [launcherActivity: ".UnifiedActivity"]
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
