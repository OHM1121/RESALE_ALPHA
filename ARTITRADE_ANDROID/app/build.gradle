plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.artitrade.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.artitrade.mobile'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.4.1-SWIPE-KST-EVENTDATE'
        manifestPlaceholders = [launcherActivity: ".MainActivity"]
        ndk { abiFilters 'arm64-v8a' }
    }
    flavorDimensions 'market'
    productFlavors {
        stock {
            dimension 'market'
            applicationId 'com.artitrade.stock.s21dex'
            buildConfigField 'String', 'MARKET', '"stock"'
            resValue 'string', 'app_name', 'ARTITRADE 주식'
        }
        hub {
            dimension 'market'
            versionName '0.2.0-PHONE-SERVER'
            applicationId 'com.artitrade.hub.s21dex'
            buildConfigField 'String', 'MARKET', '"hub"'
            resValue 'string', 'app_name', 'ARTITRADE 폰 서버'
        }
        coin {
            dimension 'market'
            applicationId 'com.artitrade.coin.s21dex'
            buildConfigField 'String', 'MARKET', '"coin"'
            resValue 'string', 'app_name', 'ARTITRADE 코인'
        }
        unified {
            dimension 'market'
            versionName '0.7.4-PHONE-MAIN-VISUAL-API-DIAG'
            applicationId 'com.artitrade.unified.s21dex'
            buildConfigField 'String', 'MARKET', '"both"'
            resValue 'string', 'app_name', 'ARTITRADE 통합'
            manifestPlaceholders = [launcherActivity: ".UnifiedVisualActivity"]
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "requests==2.32.5"
            install "websockets==15.0.1"
            install "holidays"
        }
    }
}
