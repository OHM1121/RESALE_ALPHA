plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.artitrade.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.artitrade.mobile'
        minSdk 28
        targetSdk 35
        versionCode 26
        versionName '0.4.1-SWIPE-KST-EVENTDATE'
        manifestPlaceholders = [launcherActivity: ".MainActivity", emulatorServiceEnabled: "true"]
        ndk {
            // User-facing Samsung APK remains arm64-only. GitHub emulator
            // smoke builds exactly the same Java/Python code for x86_64.
            if (System.getenv('ARTITRADE_EMULATOR_ABI') == 'x86_64') {
                abiFilters 'x86_64'
            } else {
                abiFilters 'arm64-v8a'
            }
        }
    }
    flavorDimensions 'market'
    productFlavors {
        stock {
            dimension 'market'
            applicationId 'com.artitrade.stock.s21dex'
            buildConfigField 'String', 'MARKET', '"stock"'
            resValue 'string', 'app_name', 'ARTITRADE 주식'
        }
        hub {
            dimension 'market'
            versionName '0.2.6-LARGE-LEDGER'
            applicationId 'com.artitrade.hub.s21dex'
            buildConfigField 'String', 'MARKET', '"hub"'
            resValue 'string', 'app_name', 'ARTITRADE MSERVER'
        }
        coin {
            dimension 'market'
            applicationId 'com.artitrade.coin.s21dex'
            buildConfigField 'String', 'MARKET', '"coin"'
            resValue 'string', 'app_name', 'ARTITRADE 코인'
        }
        unified {
            dimension 'market'
            versionCode 43
            versionName '0.7.36-RESEARCH-EXE-GMO-FILTER-MSERVER'
            applicationId 'com.artitrade.unified.s21dex'
            buildConfigField 'String', 'MARKET', '"both"'
            resValue 'string', 'app_name', 'ARTITRADE 통합'
            manifestPlaceholders = [launcherActivity: ".UnifiedVisualActivity",
                emulatorServiceEnabled: System.getenv('ARTITRADE_EMULATOR_FIXTURE') == '1' ? "false" : "true"]
        }
    }
    signingConfigs {
        ciStable {
            // GitHub Actions restores the keystore at this exact path before Gradle runs.
            // Do not rely on Gradle's implicit debug key (it rotated every build).
            storeFile file((System.getenv('HOME') ?: System.getProperty('user.home')) + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (System.getenv('CI') == 'true') {
                signingConfig signingConfigs.ciStable
            }
        }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "requests==2.32.5"
            install "websockets==15.0.1"
            install "holidays"
        }
    }
}
