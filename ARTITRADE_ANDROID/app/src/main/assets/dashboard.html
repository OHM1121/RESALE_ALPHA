<script>
(function(){
'use strict';
var state={market:'stock',status:null,records:{},selectedStrategy:'at',page:'home'};
var $=function(id){return document.getElementById(id);};
var marketNames={stock:['AT','CW'],coin:['B','MA']};
var bucketRecords={};
function validData(record){return record && record.ok===true && record.exists===true && record.data && typeof record.data==='object' ? record.data : {};}
function n(v,suffix){
 if(v===null||v===undefined||v==='')return '—';
 var x=Number(v);if(!Number.isFinite(x))return '—';
 var dec=Math.abs(x)>=100?0:Math.abs(x)>=1?1:2;
 return x.toLocaleString('ko-KR',{maximumFractionDigits:dec})+(suffix||'');
}

function value(o,keys){for(var i=0;i<keys.length;i++){if(o && Object.prototype.hasOwnProperty.call(o,keys[i]) && o[keys[i]]!==null && o[keys[i]]!=='')return o[keys[i]];}return null;}
function text(id,content){var e=$(id);if(e)e.textContent=content;}
function el(tag,cl,t){var e=document.createElement(tag);if(cl)e.className=cl;if(t!==undefined)e.textContent=t;return e;}
function list(container,rows,kind){
 container.textContent='';
 if(!Array.isArray(rows)||rows.length===0){
  var empty=el('div','empty');empty.appendChild(el('span','empty-icon','◌'));empty.appendChild(el('span','', '표시할 데이터 없음'));container.appendChild(empty);return;
 }
 rows.slice(0,80).forEach(function(row){
  if(!row || typeof row!=='object')return;
  var name=value(row,kind==='positions'?['symbol','ticker','name','market']:kind==='pending'?['symbol','ticker','name','market']:['symbol','ticker','name','action','type']);
  var hint=value(row,kind==='executions'?['filled_at','time','at','side']:['stage','status','tf','time']);
  var amt=value(row,kind==='positions'?['profit_rate','pnl_pct','pnl','paper_pnl']:kind==='pending'?['score','price','target_price']:['price','fill_price','qty','pnl']);
  var outer=el('div','list-row');var left=el('div');left.appendChild(el('div','name',name===null?'—':String(name).slice(0,45)));left.appendChild(el('div','hint',hint===null?'':String(hint).slice(0,72)));outer.appendChild(left);
  var right=el('div','num',amt===null?'—':n(amt,kind==='positions'&&String(value(row,['profit_rate','pnl_pct']))===String(amt)?'%':''));shade(right,amt);outer.appendChild(right);container.appendChild(outer);
 });
}
function drawGraph(series){
 var box=$('graph');box.textContent='';
 if(!Array.isArray(series)||series.length<2){box.appendChild(el('div','missing','집계 전'));return;}
 var points=series.map(function(x){return typeof x==='number'?x:(x&&typeof x==='object'?Number(value(x,['value','equity','balance','pnl'])):NaN);}).filter(Number.isFinite).slice(-150);
 if(points.length<2){box.appendChild(el('div','missing','집계 전'));return;}
 var min=Math.min.apply(null,points),max=Math.max.apply(null,points),range=Math.max(.00001,max-min);
 var coords=points.map(function(v,i){return [10+580*i/(points.length-1),94-82*(v-min)/range];});
 var ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 600 105');svg.setAttribute('preserveAspectRatio','none');
 [25,60,95].forEach(function(y){var line=document.createElementNS(ns,'line');line.setAttribute('x1','0');line.setAttribute('y1',y);line.setAttribute('x2','600');line.setAttribute('y2',y);svg.appendChild(line);});
 var d=coords.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var area=document.createElementNS(ns,'path');area.setAttribute('class','area');area.setAttribute('d',d+' L590 105 L10 105 Z');svg.appendChild(area);
 var line2=document.createElementNS(ns,'path');line2.setAttribute('class','line');line2.setAttribute('d',d);svg.appendChild(line2);
 var dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',coords[coords.length-1][0]);dot.setAttribute('cy',coords[coords.length-1][1]);dot.setAttribute('r','4');svg.appendChild(dot);
 box.appendChild(svg);
}
function currentLedger(){var rec=state.records.sharedLedger;return validData(rec);}
function statusOf(){return state.status && state.status.ok ? state.status : null;}
function currentMode(){
 var s=statusOf();var o=s?s[state.market]:null;
 if(!o || !o.ok)return '—';
 if(o.desired==='off')return '정지';
 if(o.desired==='pc')return 'PC';
 if(o.desired==='phone')return '폰';
 return '—';
}
function strategyKey(label){return state.market==='stock'?(label==='AT'?'at':'cw'):(label==='B'?'general':'ma');}
function buildStrategies(targetId){
 var target=$(targetId);target.textContent='';
 marketNames[state.market].forEach(function(label){
  var key=strategyKey(label);var d=validData(state.records[key+'Ledger']);
  var profit=value(d,['total_pnl','pnl','realized_pnl','profit']);
  var count=value(d,['positions_count','open_count']);
  var card=el('article','card strategy');var left=el('div');left.appendChild(el('div','strat-title',label));left.appendChild(el('div','strat-note', count===null?'연동 대기':n(count)+' 보유'));card.appendChild(left);
  var right=el('div','value',n(profit));shade(right,profit);card.appendChild(right);target.appendChild(card);
 });
}
function redraw(){
 var s=statusOf(),o=s?s[state.market]:null;
 var connected=!!s;var pill=$('syncPill');pill.className='sync '+(connected?'online':'offline');
 text('syncName',connected?'서버 연결':'서버 연결 안 됨');
 text('deviceMode',currentMode());text('detailSync',connected?'정상':'미연결');text('detailDevice',currentMode());text('strategyMode',currentMode());
 var ledger=currentLedger(),pnl=value(ledger,['total_pnl','net_pnl','profit','total_profit']);
 var pnlRate=value(ledger,['total_return_pct','pnl_pct','profit_rate','return_pct']);
 text('pnl',n(pnl));shade($('pnl'),pnl);text('pnlPct',n(pnlRate,'%'));shade($('pnlPct'),pnlRate);
 var realized=value(ledger,['realized_pnl','realized_profit']);var unreal=value(ledger,['unrealized_pnl','unrealized_profit','holding_pnl']);
 text('realized',n(realized));text('unrealized',n(unreal));shade($('realized'),realized);shade($('unrealized'),unreal);
 var win=value(ledger,['win_rate','win_rate_pct','winning_pct']);text('winRate',n(win,'%'));
 var positions=value(ledger,['positions','holdings']);var pending=value(ledger,['pending','pending_orders','candidates']);
 var pcount=value(ledger,['positions_count','holdings_count']);var dcount=value(ledger,['pending_count']);
 if(pcount===null && Array.isArray(positions))pcount=positions.length;
 if(dcount===null && Array.isArray(pending))dcount=pending.length;
 text('positionPending',n(pcount)+' / '+n(dcount));text('positionCount',n(pcount));text('pendingCount',n(dcount));
 var fraction=value(ledger,['invested_pct','utilization_pct']);$('accountBar').style.width=fraction!==null?Math.max(0,Math.min(100,Number(fraction)))+'%':'0%';text('accountShare',n(fraction,'%'));
 drawGraph(value(ledger,['equity_curve','profit_series','balance_history']));
 list($('positionsList'),positions,'positions');list($('pendingList'),pending,'pending');list($('executionsList'),value(ledger,['executions','fills','transactions']),'executions');
 var homePositions=$('homePositions'),homeExecutions=$('homeExecutions');
 if(homePositions)list(homePositions,Array.isArray(positions)?positions.slice(0,5):null,'positions');
 var recent=value(ledger,['executions','fills','transactions']);
 if(homeExecutions)list(homeExecutions,Array.isArray(recent)?recent.slice(0,5):null,'executions');
 buildStrategies('strategyGrid');buildStrategies('strategyDetail');
 var rd=validData(state.records.sharedResearch);
 var rr=value(rd,['items','results','research']);
 var researchRows=Array.isArray(rr)?rr:null;
 if(!researchRows && rd && Object.keys(rd).length){researchRows=[{name:'동기화 연구 데이터',status:'저장됨',score:Object.keys(rd).length}];}
 list($('researchList'),researchRows,'research');
 var control=$('strategyControls');control.textContent='';
 marketNames[state.market].forEach(function(label){
  var key=strategyKey(label);var tab=el('button','tab'+(state.selectedStrategy===key?' active':''),label);tab.addEventListener('click',function(){state.selectedStrategy=key;drawStrategyRaw();redraw();});control.appendChild(tab);
 });
 drawStrategyRaw();
}
function drawStrategyRaw(){
 var target=$('strategyRaw');target.textContent='';
 var d=validData(state.records[state.selectedStrategy+'Ledger']);
 if(!Object.keys(d).length){target.appendChild(el('div','empty','동기화된 운용 데이터 없음'));return;}
 var keys=Object.keys(d).filter(function(k){return !Array.isArray(d[k]) && d[k]!==null && typeof d[k]!=='object';}).slice(0,12);
 keys.forEach(function(k){var row=el('div','list-row');row.appendChild(el('span','name',k));row.appendChild(el('span','num',String(d[k]).slice(0,70)));target.appendChild(row);});
 if(!keys.length)target.appendChild(el('div','empty','수치 데이터 없음'));
}
function go(page){
 if(!document.getElementById('page-'+page))return;
 state.page=page;Array.from(document.querySelectorAll('.detail')).forEach(function(e){e.classList.toggle('active',e.id==='page-'+page);});
 Array.from(document.querySelectorAll('.nav')).forEach(function(e){e.classList.toggle('active',e.dataset.page===page);});
 $('view').scrollTop=0;redraw();
}
function action(id){
 if(!window.Artitrade || typeof window.Artitrade.action!=='function')return;
 window.Artitrade.action(id);
}
document.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.page);});});
document.querySelectorAll('[data-act]').forEach(function(b){b.addEventListener('click',function(){if(b.dataset.act==='refresh'){refresh();return;}action(b.dataset.act);});});
function refresh(){text('syncName','확인 중');if(window.Artitrade && typeof window.Artitrade.refresh==='function')window.Artitrade.refresh();}
window.__ARTI_UPDATE=function(raw){
 try{
  var incoming=JSON.parse(raw);state.market=incoming.market==='coin'?'coin':'stock';
  state.status=incoming.status&&incoming.status.ok?incoming.status:null;
  state.records=incoming.records||{};
  state.selectedStrategy=strategyKey(marketNames[state.market][0]);
  text('marketSub',state.market==='stock'?'STOCK / AT + CW':'COIN / B + MA');
  text('marketChip',state.market==='stock'?'KOSPI · KOSDAQ':'DIGITAL ASSETS');
  redraw();
 }catch(error){text('syncName','조회 오류');}
};
if(window.Artitrade && typeof window.Artitrade.market==='function'){
 var market=window.Artitrade.market();state.market=market==='coin'?'coin':'stock';
 text('marketSub',state.market==='stock'?'STOCK / AT + CW':'COIN / B + MA');
 text('marketChip',state.market==='stock'?'KOSPI · KOSDAQ':'DIGITAL ASSETS');
 state.selectedStrategy=strategyKey(marketNames[state.market][0]);
}
redraw();refresh();
})();
</script>
